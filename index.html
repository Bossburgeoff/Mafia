<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Мафия Онлайн</title>
<style>
:root{--bg:#121212;--night:#0b0f1a;--surf:#1d1d1d;--raised:#2a2a29;--text:#fff;--sub:rgba(255,255,255,.62);--bd:rgba(255,255,255,.13);
--blue:#5E9FE8;--green:#72BC8F;--orange:#DE9255;--red:#E97366}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .8s;-webkit-tap-highlight-color:transparent}
body.night{background:var(--night)}
.screen{display:none;min-height:100%}
.screen.on{display:block}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 24px}
h1{font-size:28px;line-height:1.15;margin-bottom:6px}
h2{font-size:18px;margin:18px 0 10px}
.sub{color:var(--sub);line-height:1.5;font-size:15px}
.hint{font-size:13px;color:var(--sub);line-height:1.45}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:650;cursor:pointer;background:var(--blue);color:#fff;margin-top:10px;transition:transform .08s,opacity .2s;font-family:inherit}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:var(--raised);color:var(--text)}.btn.red{background:#d4574b}.btn.green{background:#3f8f63}
.btn.sm{display:inline-block;width:auto;padding:9px 14px;font-size:14px;margin:0}
input,select{width:100%;background:var(--raised);border:1px solid var(--bd);color:var(--text);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit}
.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.check{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px}.check input{width:20px;height:20px}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
/* menu */
#menu{display:none;flex-direction:column;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#2a1414 0%,#0b0f1a 60%)}
#menu.on{display:flex}
.logo{text-align:center;margin-bottom:38px}
.logo .hat{font-size:76px;filter:drop-shadow(0 8px 24px rgba(233,115,102,.35))}
.logo .t{font-size:44px;font-weight:900;letter-spacing:.14em;color:var(--red);margin-top:6px}
.logo .s{color:var(--sub);letter-spacing:.3em;font-size:12px;margin-top:4px}
.menu-btns{max-width:340px;margin:0 auto;width:100%;padding:0 20px}
.menu-btns .btn{padding:17px;font-size:18px}
.ver{text-align:center;color:var(--sub);font-size:12px;margin-top:30px}
/* lobby */
.code{font-size:44px;font-weight:900;letter-spacing:.25em;text-align:center;font-variant-numeric:tabular-nums;color:var(--orange);cursor:pointer}
.plist{list-style:none}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.plist li:last-child{border:0}
.plist .nm{flex:1}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--raised);color:var(--sub)}
.tag.host{background:rgba(222,146,85,.18);color:var(--orange)}
.x{background:none;border:0;color:var(--red);font-size:24px;cursor:pointer;padding:0 6px}
/* game */
#game .wrap{padding-bottom:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ph{display:flex;align-items:center;gap:10px}
.ph .ic{font-size:28px}
.ph .tt{font-weight:800;font-size:18px}.ph .st{font-size:12px;color:var(--sub)}
.clock{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:86px;text-align:right}
.clock.warn{color:var(--orange)}
.bar{height:4px;background:var(--raised);border-radius:2px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s linear}
.narr{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,rgba(94,159,232,.12),rgba(191,142,218,.10));border:1px solid rgba(94,159,232,.25);border-radius:16px;padding:14px;margin-bottom:12px}
.narr .av{width:38px;height:38px;border-radius:50%;background:#26324a;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 38px}
.narr .who{font-size:12px;color:var(--blue);font-weight:700;margin-bottom:2px}
.narr .tx{font-size:16px;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.chip{background:var(--raised);border:2px solid transparent;border-radius:12px;padding:12px;font-size:15px;cursor:pointer;text-align:left;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:inherit}
.chip.sel{border-color:var(--red);background:rgba(233,115,102,.14)}
.chip.selb{border-color:var(--blue);background:rgba(94,159,232,.14)}
.chip.selg{border-color:var(--green);background:rgba(114,188,143,.14)}
.chip:disabled{opacity:.3;cursor:not-allowed}
.chip .r{font-size:12px;color:var(--sub)}
.res{font-size:20px;font-weight:800;text-align:center;padding:16px;border-radius:14px;margin-top:10px}
.res.bad{background:rgba(233,115,102,.15);color:var(--red)}.res.good{background:rgba(114,188,143,.15);color:var(--green)}.res.info{background:rgba(94,159,232,.15);color:var(--blue)}
.sleep{text-align:center;padding:26px 10px}.sleep .z{font-size:46px}
.rolecard{text-align:center}.rolecard .big{font-size:64px}.rolecard .nm{font-size:26px;font-weight:800;margin-top:4px}
.maf{color:var(--red)}.town{color:var(--green)}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;margin-bottom:12px}
.seat{background:var(--surf);border:1px solid var(--bd);border-radius:12px;padding:8px;font-size:13px;position:relative;min-height:54px}
.seat .n{font-size:11px;color:var(--sub)}.seat .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.seat .ic{position:absolute;top:6px;right:7px;font-size:13px}
.seat.dead{opacity:.35}.seat.dead .s{text-decoration:line-through}
.seat.spk{border-color:var(--blue);box-shadow:0 0 0 2px rgba(94,159,232,.35)}
.seat.me{background:#24262b}
.seat.mate{border-color:rgba(233,115,102,.55)}
.noms{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.noms span{background:rgba(222,146,85,.18);color:var(--orange);font-size:14px;padding:6px 10px;border-radius:999px}
.chat{background:var(--surf);border:1px solid var(--bd);border-radius:16px;margin-bottom:12px;overflow:hidden}
.chatlog{height:220px;overflow-y:auto;padding:10px 12px;font-size:14px;line-height:1.45}
.chatlog .m{margin-bottom:5px;word-wrap:break-word}
.chatlog .m b{color:var(--blue);font-weight:650}
.chatlog .m.sys{color:var(--sub);font-style:italic}
.chatlog .m.mf{color:#f3b0a8}.chatlog .m.mf b{color:var(--red)}
.chatin{display:flex;border-top:1px solid var(--bd)}
.chatin input{border:0;border-radius:0;background:transparent}
.chatin button{background:none;border:0;color:var(--blue);font-weight:700;padding:0 16px;cursor:pointer;font-size:15px}
.chatin button:disabled{opacity:.3}
.gbtns{display:flex;gap:8px;margin-bottom:16px}.gbtns .btn{margin:0}
.vlist{list-style:none;font-size:14px}.vlist li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}.vlist li:last-child{border:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surf);width:100%;max-width:620px;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 18px;border-radius:12px;z-index:30;font-size:14px;max-width:90%;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.banner{background:rgba(233,115,102,.12);color:var(--red);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;text-align:center}
.notes{margin-top:10px;font-size:14px}.notes div{padding:4px 0;color:var(--sub)}
</style>
</head>
<body class="night">

<!-- ГЛАВНОЕ МЕНЮ -->
<div id="menu" class="screen on">
  <div class="logo"><div class="hat">🎩</div><div class="t">МАФИЯ</div><div class="s">ОНЛАЙН · ВЕДУЩИЙ-ИИ</div></div>
  <div class="menu-btns">
    <button class="btn red" data-a="create">Создать лобби</button>
    <button class="btn" data-a="joinOpen">Присоединиться к лобби</button>
    <button class="btn ghost" data-a="settings">Настройки</button>
    <button class="btn ghost" data-a="exit">Выйти из игры</button>
    <div class="ver" id="ver"></div>
  </div>
</div>

<!-- ЛОББИ -->
<div id="lobby" class="screen"><div class="wrap" id="lobbyBox"></div></div>

<!-- ИГРА -->
<div id="game" class="screen"><div class="wrap">
  <div class="topbar"><div class="ph"><div class="ic" id="gIc"></div><div><div class="tt" id="gTitle"></div><div class="st" id="gSub"></div></div></div><div class="clock" id="gClock"></div></div>
  <div class="bar"><i id="gBar"></i></div>
  <div class="narr"><div class="av">🤖</div><div><div class="who">ВЕДУЩИЙ</div><div class="tx" id="gNarr"></div></div></div>
  <div id="gBanner"></div>
  <div id="gAction"></div>
  <div class="seats" id="gSeats"></div>
  <div class="chat"><div class="chatlog" id="chatlog"></div><div class="chatin"><input id="chatIn" maxlength="300" autocomplete="off"><button id="chatSend">➤</button></div></div>
  <div class="gbtns"><button class="btn ghost" data-a="myRole">🎭 Моя роль</button><button class="btn ghost" data-a="settings">⚙︎</button><button class="btn ghost" data-a="leave">Выйти</button></div>
</div></div>

<!-- ВЫХОД -->
<div id="bye" class="screen"><div class="wrap" style="text-align:center;padding-top:30vh"><div style="font-size:60px">🌙</div><h1>Спасибо за игру!</h1><p class="sub">Вкладку можно закрыть.</p><button class="btn ghost" data-a="toMenu" style="max-width:280px;margin:20px auto 0">В главное меню</button></div></div>

<div id="modal"></div>

<script src="peerjs.min.js"></script>
<script>
'use strict';
const VERSION='1.0';
/* =========================================================
   ОБЩЕЕ
   ========================================================= */
const ROLES={
  civ:{name:'Мирный житель',icon:'🏠',team:'town',desc:'Днём ищи мафию и голосуй против неё. Ночью спишь.'},
  maf:{name:'Мафия',icon:'🔫',team:'maf',desc:'Ночью с семьёй выбираешь жертву. Последнее слово за доном.'},
  don:{name:'Дон мафии',icon:'🎩',team:'maf',desc:'Окончательно решаешь, кого убить, а потом ищешь шерифа.'},
  sher:{name:'Шериф',icon:'⭐',team:'town',desc:'Каждую ночь проверяешь одного игрока: мафия или нет.'},
  doc:{name:'Доктор',icon:'💉',team:'town',desc:'Каждую ночь лечишь одного игрока. Себя — только один раз за игру.'}
};
const isMafR=r=>r&&ROLES[r].team==='maf';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const fmt=ms=>{const s=Math.ceil(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c};
const minsWord=s=>{if(s%60){return `${s} ${plural(s,'секунда','секунды','секунд')}`}const m=s/60;return m===1?'одна минута':m===2?'две минуты':m===3?'три минуты':m===4?'четыре минуты':`${m} ${plural(m,'минута','минуты','минут')}`};
const PREFIX='ailmafia-v1-';
const LOCAL=new URLSearchParams(location.search).has('local')||!window.Peer;

const ME=Object.assign({name:'',sound:true,voice:true,rate:1.05,id:uid()},JSON.parse(localStorage.getItem('mafia_me')||'{}'));
localStorage.setItem('mafia_me',JSON.stringify(ME));
const saveMe=()=>localStorage.setItem('mafia_me',JSON.stringify(ME));

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))}
function openModal(h){$('#modal').innerHTML=`<div class="modal" data-bg><div class="sheet">${h}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}

/* звук и голос ведущего */
let actx;
function beep(f=880,d=.15,n=1){if(!ME.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);const t0=actx.currentTime+i*(d+.07);g.gain.setValueAtTime(.2,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.start(t0);o.stop(t0+d)}}catch(e){}}
let ruVoice=null;
function loadVoices(){const vs=speechSynthesis.getVoices();ruVoice=vs.find(v=>/ru/i.test(v.lang)&&/google|милена|milena|yandex/i.test(v.name))||vs.find(v=>/ru/i.test(v.lang))||null}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(t){if(!ME.voice||!('speechSynthesis' in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=ME.rate;if(ruVoice)u.voice=ruVoice;speechSynthesis.speak(u)}

/* =========================================================
   СЕТЬ: PeerJS (через интернет) или BroadcastChannel (?local — тест во вкладках)
   ========================================================= */
const Net={
  host(code,onConn,ok,fail){
    if(LOCAL){
      const ch=new BroadcastChannel('mafia-'+code),conns={};
      ch.onmessage=e=>{const m=e.data;if(m.to!=='host')return;
        if(m.k==='hello'){const c={send:d=>ch.postMessage({to:m.from,k:'data',d}),close:()=>ch.postMessage({to:m.from,k:'bye'})};conns[m.from]=c;ch.postMessage({to:m.from,k:'welcome'});onConn(c)}
        else if(m.k==='data')conns[m.from]?.onData?.(m.d);
        else if(m.k==='bye'){conns[m.from]?.onClose?.();delete conns[m.from]}};
      this.destroy=()=>{Object.values(conns).forEach(c=>c.close());ch.close()};ok();return;}
    const peer=new Peer(PREFIX+code.toLowerCase(),{debug:0});
    peer.on('open',ok);
    peer.on('error',e=>{if(e.type==='unavailable-id')fail('busy');else if(!peer.open)fail(e.type)});
    peer.on('disconnected',()=>{try{peer.reconnect()}catch(e){}});
    peer.on('connection',c=>{c.on('open',()=>onConn(wrapConn(c)))});
    this.destroy=()=>{try{peer.destroy()}catch(e){}};
  },
  join(code,ok,fail){
    if(LOCAL){
      const ch=new BroadcastChannel('mafia-'+code),me=uid();let opened=false;
      const c={send:d=>ch.postMessage({to:'host',from:me,k:'data',d}),close:()=>{ch.postMessage({to:'host',from:me,k:'bye'});ch.close()}};
      ch.onmessage=e=>{const m=e.data;if(m.to!==me)return;
        if(m.k==='welcome'){opened=true;ok(c)}else if(m.k==='data')c.onData?.(m.d);else if(m.k==='bye')c.onClose?.()};
      ch.postMessage({to:'host',from:me,k:'hello'});setTimeout(()=>{if(!opened){ch.close();fail('Лобби не найдено')}},2500);
      this.destroy=()=>c.close();return;}
    const peer=new Peer({debug:0});let done=false;
    const t=setTimeout(()=>{if(!done){done=true;peer.destroy();fail('Не удалось подключиться. Проверьте код.')}},15000);
    peer.on('error',e=>{if(done)return;done=true;clearTimeout(t);peer.destroy();fail(e.type==='peer-unavailable'?'Лобби с таким кодом не найдено':'Ошибка сети: '+e.type)});
    peer.on('open',()=>{const c=peer.connect(PREFIX+code.toLowerCase(),{reliable:true});
      c.on('open',()=>{if(done)return;done=true;clearTimeout(t);ok(wrapConn(c))})});
    this.destroy=()=>{try{peer.destroy()}catch(e){}};
  },
  destroy(){}
};
function wrapConn(c){const w={send:d=>{try{c.send(d)}catch(e){}},close:()=>{try{c.close()}catch(e){}}};
  c.on('data',d=>w.onData&&w.onData(d));const cl=()=>{if(!w._c){w._c=1;w.onClose&&w.onClose()}};c.on('close',cl);c.on('error',cl);return w}

/* =========================================================
   ДВИЖОК ВЕДУЩЕГО-ИИ (работает у создателя лобби)
   ========================================================= */
const DEF={maxPlayers:12,mafia:'auto',speech:120,general:180,justify:90,justifyMin:60,vote:30,last:60,night:25,reveal:false,abstain:true};
const BOT_NAMES=['Бот Аркадий','Бот Вера','Бот Глеб','Бот Дина','Бот Егор','Бот Жанна','Бот Зиновий','Бот Ира','Бот Кирилл','Бот Лиза','Бот Марк','Бот Нина'];
let H=null;
const HP=id=>H.players.find(p=>p.id===id);
const hAlive=()=>H.players.filter(p=>p.alive);
const hRole=r=>H.players.find(p=>p.role===r);
const tag=p=>`№${p.n}, ${p.name}`;

function hostCreate(code){
  H={code,hostId:ME.id,settings:Object.assign({},DEF,JSON.parse(localStorage.getItem('mafia_lobby')||'{}')),players:[],phase:'lobby',
     chat:[],narr:null,seq:0,notes:{},day:0,nightNo:0};
  H.players.push({id:ME.id,name:ME.name,bot:false,connected:true,conn:null,alive:true});
  renumber();
}
function renumber(){H.players.forEach((p,i)=>p.n=i+1)}
function say(text){H.narr={id:++H.seq,text};H.chat.push({id:H.seq,sys:true,ch:'pub',text:'🤖 '+text});trimChat()}
function trimChat(){if(H.chat.length>200)H.chat=H.chat.slice(-200)}
function note(p,t){(H.notes[p.id]=H.notes[p.id]||[]).push(t)}

let bcPending=false;
function broadcast(){if(bcPending)return;bcPending=true;setTimeout(()=>{bcPending=false;H&&H.players.forEach(p=>{if(!p.bot)sendTo(p,{t:'state',v:view(p)})})},20)}
function sendTo(p,m){if(p.id===H.hostId)setTimeout(()=>onMsg(m),0);else if(p.conn&&p.connected)p.conn.send(m)}

function chatPerm(p){
  const ph=H.phase;
  if(ph==='lobby'||ph==='end')return{ok:true,ch:'pub'};
  if(['speech','justify','lastword'].includes(ph))return H.speaker===p.id?{ok:true,ch:'pub'}:{ok:false,why:`Сейчас говорит №${HP(H.speaker).n}`};
  if(!p.alive)return{ok:false,why:'Вы выбыли и наблюдаете'};
  if((ph==='n_mafia'||ph==='night0')&&isMafR(p.role))return{ok:true,ch:'maf'};
  if(ph.startsWith('n_')||ph==='night0')return{ok:false,why:'Ночью город спит'};
  if(ph==='general')return{ok:true,ch:'pub'};
  return{ok:false,why:'Сейчас писать нельзя'};
}
function view(p){
  const isM=isMafR(p.role),now=Date.now(),N=H.night||{};
  return{code:H.code,hostId:H.hostId,meId:p.id,phase:H.phase,day:H.day,nightNo:H.nightNo,settings:H.settings,
    left:H.deadline?Math.max(0,H.deadline-now):null,total:H.total||0,minLeft:H.minUntil?Math.max(0,H.minUntil-now):0,
    players:H.players.map(q=>({id:q.id,n:q.n,name:q.name,bot:q.bot,connected:q.bot||q.connected,alive:q.alive,
      role:(H.phase==='end'||q.id===p.id||(isM&&isMafR(q.role))||q.revealed)?q.role:null})),
    role:p.role,alive:p.alive,speaker:H.speaker??null,nominees:H.nominees||[],nomBy:H.nomBy||{},
    voted:H.votes?Object.keys(H.votes).length:0,myVote:H.votes?H.votes[p.id]:undefined,voteResult:H.phase==='voteResult'?H.voteResult:null,
    lastNight:H.lastNight,props:isM?N.props:null,donPick:isM?N.donPick:null,
    myCheck:p.role==='don'?N.donCheck:p.role==='sher'?N.sherCheck:p.role==='doc'?N.heal:null,
    docSelf:p.role==='doc'?H.docSelf:null,notes:H.notes[p.id]||[],narr:H.narr,winner:H.winner,revote:H.revote,
    chat:H.chat.filter(m=>m.ch==='pub'||(m.ch==='maf'&&isM)).slice(-120),perm:chatPerm(p)};
}

/* приём сообщений от игроков */
function hostOnConn(c){
  let pid=null;
  c.onData=m=>{
    if(m.t==='join'){
      const ex=HP(m.id);
      if(ex&&!ex.bot){ex.conn=c;ex.connected=true;pid=ex.id;if(H.phase==='lobby')ex.name=m.name;broadcast();return}
      if(H.phase!=='lobby'){c.send({t:'err',msg:'Игра уже идёт'});return}
      if(H.players.length>=H.settings.maxPlayers){c.send({t:'err',msg:'Лобби заполнено'});return}
      H.players.push({id:m.id,name:String(m.name).slice(0,20),bot:false,connected:true,conn:c,alive:true});pid=m.id;renumber();
      H.chat.push({id:++H.seq,sys:true,ch:'pub',text:`${m.name} заходит в лобби`});broadcast();return}
    if(pid)hostHandle(pid,m);
  };
  c.onClose=()=>{const p=pid&&HP(pid);if(!p)return;p.connected=false;
    if(H.phase==='lobby'){H.players=H.players.filter(x=>x!==p);renumber();H.chat.push({id:++H.seq,sys:true,ch:'pub',text:`${p.name} покидает лобби`})}
    broadcast()};
}
function shorten(ms){if(H.deadline&&H.deadline>Date.now()+ms){H.deadline=Date.now()+ms}broadcast()}

function hostHandle(pid,m){
  const p=HP(pid);if(!p)return;const ph=H.phase,N=H.night,isHost=pid===H.hostId;
  const t=m.target,T=t!=null&&t!=='x'?HP(t):null;
  switch(m.a){
  case 'chat':{const pr=chatPerm(p);const tx=String(m.text||'').trim().slice(0,300);if(!pr.ok||!tx)return;
    H.chat.push({id:++H.seq,from:p.id,n:p.n,name:p.name,ch:pr.ch,text:tx});trimChat();broadcast();return}
  case 'end':if(H.speaker===pid&&['speech','lastword','justify'].includes(ph)){if(ph==='justify'&&Date.now()<H.minUntil)return;advance()}return;
  case 'nominate':if(ph==='speech'&&H.speaker===pid&&H.day>=2&&H.nomBy[pid]==null&&T&&T.alive&&t!==pid&&!H.nominees.includes(t)){
    H.nominees.push(t);H.nomBy[pid]=t;H.chat.push({id:++H.seq,sys:true,ch:'pub',text:`⚖️ №${p.n} выставляет №${T.n}, ${T.name}`});broadcast()}return;
  case 'unnominate':if(ph==='speech'&&H.speaker===pid&&H.nomBy[pid]!=null){H.nominees=H.nominees.filter(x=>x!==H.nomBy[pid]);delete H.nomBy[pid];broadcast()}return;
  case 'vote':if(ph==='vote'&&p.alive&&(H.nominees.includes(t)||(t==='x'&&H.settings.abstain))){H.votes[pid]=t;
    if(hAlive().every(a=>H.votes[a.id]!==undefined))shorten(1500);else broadcast()}return;
  case 'pick':if(!p.alive||!T||!T.alive)return;
    if(ph==='n_mafia'&&isMafR(p.role)){if(p.role==='don'){N.donPick=t;shorten(2500)}else{N.props[pid]=t;
        const don=hRole('don');if(!don.alive&&hAlive().filter(x=>isMafR(x.role)).every(x=>N.props[x.id]!=null))shorten(2500);else broadcast()}}
    else if(ph==='n_don'&&p.role==='don'&&N.donCheck==null&&t!==pid){N.donCheck=t;note(p,`Ночь ${H.nightNo}: №${T.n} ${T.name} — ${T.role==='sher'?'⭐ ШЕРИФ':'не шериф'}`);shorten(3500)}
    else if(ph==='n_sher'&&p.role==='sher'&&N.sherCheck==null&&t!==pid){N.sherCheck=t;note(p,`Ночь ${H.nightNo}: №${T.n} ${T.name} — ${isMafR(T.role)?'👎 МАФИЯ':'👍 мирный'}`);shorten(3500)}
    else if(ph==='n_doc'&&p.role==='doc'&&N.heal==null&&(t!==pid||!H.docSelf)){N.heal=t;shorten(2500)}
    return;
  }
  if(!isHost)return;
  switch(m.a){
  case 'settings':if(ph!=='lobby')return;Object.assign(H.settings,m.s);localStorage.setItem('mafia_lobby',JSON.stringify(H.settings));
    while(H.players.length>H.settings.maxPlayers&&H.players.some(x=>x.bot)){const b=[...H.players].reverse().find(x=>x.bot);H.players=H.players.filter(x=>x!==b)}renumber();broadcast();break;
  case 'addBot':if(ph==='lobby'&&H.players.length<H.settings.maxPlayers){const used=H.players.map(x=>x.name);
    H.players.push({id:'bot-'+uid(),name:BOT_NAMES.find(n=>!used.includes(n))||'Бот',bot:true,connected:true,alive:true});renumber();broadcast()}break;
  case 'fillBots':while(ph==='lobby'&&H.players.length<Math.max(10,Math.min(H.settings.maxPlayers,10)))hostHandle(pid,{a:'addBot'});break;
  case 'kick':{const k=HP(m.id);if(ph==='lobby'&&k&&k.id!==H.hostId){if(k.conn){k.conn.send({t:'kicked'});setTimeout(()=>k.conn.close(),300)}H.players=H.players.filter(x=>x!==k);renumber();broadcast()}break}
  case 'start':startGame();break;
  case 'toLobby':if(ph==='end'){H.players=H.players.filter(x=>x.bot||x.connected);H.players.forEach(x=>{x.role=null;x.alive=true;x.revealed=false});renumber();
    Object.assign(H,{phase:'lobby',deadline:null,day:0,nightNo:0,notes:{},winner:null,speaker:null,nominees:[],lastNight:undefined});H.narr=null;broadcast()}break;
  }
}

/* --- фазы --- */
function enter(phase,sec,line){H.phase=phase;H.total=sec*1000;H.deadline=sec?Date.now()+sec*1000:null;H.botAt=Date.now()+rnd(2500,5500);H.botDone=false;if(line)say(line);broadcast()}
function startGame(){
  const n=H.players.length;if(H.phase!=='lobby'||n<10||n>12)return;
  const m=H.settings.mafia==='auto'?(n>=12?3:2):+H.settings.mafia;
  const roles=[...Array(n-m-3).fill('civ'),...Array(m).fill('maf'),'don','sher','doc'];
  for(let i=roles.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[roles[i],roles[j]]=[roles[j],roles[i]]}
  H.players.forEach((p,i)=>{p.role=roles[i];p.alive=true;p.revealed=false});
  Object.assign(H,{day:0,nightNo:0,notes:{},docSelf:false,starter:0,winner:null,speaker:null,nominees:[],nomBy:{},votes:null,lastNight:undefined,night:{props:{}}});
  enter('night0',15,'Город засыпает. Раздаются роли. Мафия, откройте глаза и молча познакомьтесь друг с другом. Этой ночью никто не действует.');
}
function startDay(){
  H.day++;H.speaker=null;
  if(H.day===1)enter('morning',6,'Город просыпается. Наступает первый день. Каждому — слово для знакомства, голосования сегодня нет.');
  else{const k=H.lastNight!=null?HP(H.lastNight):null;
    enter('morning',7,k?`Город просыпается. Этой ночью был убит игрок ${tag(k)}.`:pick(['Город просыпается. Этой ночью никто не погиб.','Город просыпается. Удивительно, но этой ночью обошлось без жертв.']))}
}
function afterMorning(){if(!checkWin())startSpeeches()}
function lastWord(id,from){H.speaker=id;H.lwFrom=from;const p=HP(id);enter('lastword',H.settings.last,`Последнее слово игроку ${tag(p)}.`)}
function startSpeeches(){
  let s=H.starter%H.players.length;while(!H.players[s].alive)s=(s+1)%H.players.length;
  H.order=[];for(let i=0;i<H.players.length;i++){const p=H.players[(s+i)%H.players.length];if(p.alive)H.order.push(p.id)}
  H.starter=s+1;H.nominees=[];H.nomBy={};H.revote=false;H.si=-1;nextSpeech();
}
function nextSpeech(){H.si++;
  if(H.si<H.order.length){H.speaker=H.order[H.si];const p=HP(H.speaker);
    enter('speech',H.settings.speech,H.si===0?`Начинаем. Слово игроку ${tag(p)}. У каждого ${minsWord(H.settings.speech)}.`:`Слово игроку ${tag(p)}.`)}
  else{H.speaker=null;enter('general',H.settings.general,`Общее обсуждение. У вас ${minsWord(H.settings.general)}.`+(H.day>=2&&H.nominees.length?` На голосовании: ${H.nominees.map(i=>'№'+HP(i).n).join(', ')}.`:''))}
}
function afterGeneral(){
  if(H.day<2){say('Первый день окончен. Голосования сегодня нет.');startNight()}
  else if(!H.nominees.length){say('Никто не выставлен. Голосования не будет.');startNight()}
  else{H.ji=-1;nextJustify()}
}
function nextJustify(){H.ji++;
  if(H.ji<H.nominees.length){H.speaker=H.nominees[H.ji];const p=HP(H.speaker);
    H.minUntil=H.revote?0:Date.now()+H.settings.justifyMin*1000;
    enter('justify',H.revote?45:H.settings.justify,`Слово для оправдания игроку ${tag(p)}.`)}
  else{H.speaker=null;H.minUntil=0;H.votes={};enter('vote',H.settings.vote,'Голосование! Голосуют все живые игроки, только за выставленных.')}
}
function tally(){
  const vals=Object.values(H.votes);
  const counts=H.nominees.map(id=>({id,v:vals.filter(x=>x===id).length})).sort((a,b)=>b.v-a.v);
  const abst=vals.filter(x=>x==='x').length,max=counts[0].v,top=counts.filter(c=>c.v===max).map(c=>c.id);
  let out=null,tie=false;if(max>0){if(top.length===1)out=top[0];else tie=true}
  H.voteResult={counts,abst,out,tie,top,votes:{...H.votes}};
  const line=out!=null?`Город изгоняет игрока ${tag(HP(out))}.`:tie&&!H.revote?'Равенство голосов! Будет повторное оправдание и переголосование.':'Никто не покидает город.';
  enter('voteResult',7,line);
}
function afterVoteResult(){const r=H.voteResult;
  if(r.out!=null){die(r.out);lastWord(r.out,'day')}
  else if(r.tie&&!H.revote){H.nominees=r.top;H.revote=true;H.ji=-1;nextJustify()}
  else startNight();
}
function die(id){const p=HP(id);p.alive=false;if(H.settings.reveal)p.revealed=true}
function startNight(){H.nightNo++;H.speaker=null;H.night={props:{},donPick:null,kill:null,donCheck:null,sherCheck:null,heal:null};nightStep('n_mafia')}
const NIGHT_LINES={n_mafia:'Город засыпает. Просыпается мафия и выбирает жертву. Последнее слово за доном.',n_don:'Мафия засыпает. Дон остаётся и ищет шерифа.',n_sher:'Дон засыпает. Просыпается шериф и ищет мафию.',n_doc:'Шериф засыпает. Просыпается доктор.'};
function nightStep(st){
  const actor={n_don:'don',n_sher:'sher',n_doc:'doc'}[st];
  // если роль мертва — время всё равно идёт, чтобы никто не догадался
  const sec=actor&&!hRole(actor).alive?rnd(9,17):H.settings.night;
  enter(st,sec,NIGHT_LINES[st]);
}
function resolveMafia(){const N=H.night,don=hRole('don');
  if(don.alive&&N.donPick!=null&&HP(N.donPick).alive){N.kill=N.donPick;return}
  const live=hAlive().filter(x=>isMafR(x.role)).map(x=>N.props[x.id]).filter(x=>x!=null);
  if(!live.length){N.kill=null;return}
  const c={};live.forEach(x=>c[x]=(c[x]||0)+1);const mx=Math.max(...Object.values(c));N.kill=pick(Object.keys(c).filter(k=>c[k]===mx));
}
function resolveNight(){const N=H.night;let killed=null;
  if(N.kill!=null&&N.heal!==N.kill){killed=N.kill;die(killed)}
  if(N.heal!=null&&hRole('doc').id===N.heal)H.docSelf=true;
  H.lastNight=killed;startDay();
}
function checkWin(){const m=hAlive().filter(x=>isMafR(x.role)).length,t=hAlive().length-m;
  const w=m===0?'town':m>=t?'maf':null;if(!w)return false;
  H.winner=w;H.speaker=null;enter('end',0,w==='maf'?'Мафия захватила город. Победа мафии!':'Вся мафия поймана. Победа мирного города!');return true}
function advance(){
  switch(H.phase){
  case 'night0':startDay();break;
  case 'morning':if(H.day>1&&H.lastNight!=null){if(!checkWin())lastWord(H.lastNight,'night')}else afterMorning();break;
  case 'lastword':if(H.lwFrom==='night')afterMorning();else if(!checkWin())startNight();break;
  case 'speech':nextSpeech();break;
  case 'general':afterGeneral();break;
  case 'justify':nextJustify();break;
  case 'vote':tally();break;
  case 'voteResult':afterVoteResult();break;
  case 'n_mafia':resolveMafia();nightStep('n_don');break;
  case 'n_don':nightStep('n_sher');break;
  case 'n_sher':nightStep('n_doc');break;
  case 'n_doc':resolveNight();break;
  }
}

/* --- боты --- */
const BOT_LINES=['Я мирный, честно. Присматриваюсь к №{x}.','Мне подозрителен №{x} — слишком тихо себя ведёт.','Пока без подозрений, послушаю остальных.','№{x}, а почему ты так нервничаешь?','Я бы проверил №{x}.','Думаю, мафия среди тех, кто молчит.','Доверяю №{x}, остальным — пока нет.'];
const JUST_LINES=['Я мирный житель, не голосуйте за меня!','Это ошибка, мафия хочет убрать меня руками города.','Клянусь, я свой. Смотрите лучше на №{x}.'];
const LAST_LINES=['Ищите мафию среди тех, кто меня выставил.','Мне кажется, №{x} — мафия. Удачи, город.','Прощайте! Не верьте №{x}.'];
const fill=s=>s.replace('{x}',()=>pick(hAlive()).n);
function botsAct(){const N=H.night,ph=H.phase,sp=H.speaker!=null?HP(H.speaker):null;
  const botSay=(p,t)=>{H.chat.push({id:++H.seq,from:p.id,n:p.n,name:p.name,ch:'pub',text:fill(t)})};
  if(['speech','justify','lastword'].includes(ph)&&sp&&sp.bot){
    if(ph==='speech'&&H.day>=2&&Math.random()<.5){const c=hAlive().filter(x=>x.id!==sp.id&&!H.nominees.includes(x.id)&&!(isMafR(sp.role)&&isMafR(x.role)));if(c.length){const t=pick(c);H.nominees.push(t.id);H.nomBy[sp.id]=t.id;H.chat.push({id:++H.seq,sys:true,ch:'pub',text:`⚖️ №${sp.n} выставляет №${t.n}, ${t.name}`})}}
    botSay(sp,pick(ph==='speech'?BOT_LINES:ph==='justify'?JUST_LINES:LAST_LINES));H.deadline=Date.now()+2500;broadcast();return}
  const bots=hAlive().filter(b=>b.bot);
  if(ph==='vote'){bots.forEach(b=>{if(H.votes[b.id]!==undefined)return;let c=H.nominees.filter(id=>id!==b.id&&!(isMafR(b.role)&&isMafR(HP(id).role)));if(!c.length)c=H.nominees;H.votes[b.id]=pick(c)});
    if(hAlive().every(a=>H.votes[a.id]!==undefined))shorten(1500);else broadcast();return}
  const nonMaf=hAlive().filter(x=>!isMafR(x.role));
  if(ph==='n_mafia'){bots.filter(b=>b.role==='maf').forEach(b=>N.props[b.id]=pick(nonMaf).id);
    if(!hRole('don').alive&&hAlive().filter(x=>isMafR(x.role)).every(x=>N.props[x.id]!=null))shorten(2500);else broadcast()}
  const b=x=>bots.find(y=>y.role===x);
  if(ph==='n_don'&&b('don')){const c=nonMaf.filter(x=>!(H.notes[b('don').id]||[]).some(s=>s.includes(`№${x.n} `)));hostHandle(b('don').id,{a:'pick',target:pick(c.length?c:nonMaf).id})}
  if(ph==='n_sher'&&b('sher')){const me=b('sher');const c=hAlive().filter(x=>x.id!==me.id&&!(H.notes[me.id]||[]).some(s=>s.includes(`№${x.n} `)));if(c.length)hostHandle(me.id,{a:'pick',target:pick(c).id})}
  if(ph==='n_doc'&&b('doc')){const me=b('doc');const t=!H.docSelf&&Math.random()<.25?me:pick(hAlive().filter(x=>x.id!==me.id));hostHandle(me.id,{a:'pick',target:t.id})}
}
setInterval(()=>{
  if(!H||H.phase==='lobby'||H.phase==='end')return;const now=Date.now();
  const sp=H.speaker!=null&&HP(H.speaker);
  if(sp&&!sp.bot&&!sp.connected&&H.deadline-now>2000){H.deadline=now+2000;broadcast()}
  if(!H.botDone&&now>=H.botAt){H.botDone=true;botsAct()}
  if(H.phase==='n_mafia'){const don=hRole('don'),N=H.night;
    if(don.alive&&don.bot&&N.donPick==null){const humans=hAlive().filter(x=>x.role==='maf'&&!x.bot);
      if((H.botDone&&humans.every(x=>N.props[x.id]!=null))||H.deadline-now<4000){
        const vals=Object.values(N.props).filter(id=>HP(id)?.alive);N.donPick=vals.length?pick(vals):pick(hAlive().filter(x=>!isMafR(x.role))).id;shorten(2500)}}}
  if(H.deadline&&now>=H.deadline)advance();
},250);

let V=null,NET=null,endAt=0,minAt=0,lastNarr=0,lastChat=0,lastPhase=null;
function send(m){if(!NET)return;if(NET.host)hostHandle(ME.id,m);else NET.conn.send(m)}
function onMsg(m){
  if(m.t==='state'){const first=!V;V=m.v;endAt=V.left!=null?Date.now()+V.left:0;minAt=Date.now()+V.minLeft;
    if(first&&V.narr)lastNarr=V.narr.id;render()}
  else if(m.t==='err'){toast(m.msg);leaveToMenu(true)}
  else if(m.t==='kicked'){toast('Вас исключили из лобби');leaveToMenu(true)}
}
function needName(cb){
  if(ME.name)return cb();
  openModal(`<h2 style="margin-top:0">Как тебя зовут?</h2><div class="field"><input id="nmIn" maxlength="20" placeholder="Никнейм"></div><button class="btn" id="nmOk">Готово</button>`);
  $('#nmIn').focus();const ok=()=>{const v=$('#nmIn').value.trim();if(!v)return;ME.name=v;saveMe();closeModal();cb()};$('#nmOk').onclick=ok;$('#nmIn').onkeydown=e=>e.key==='Enter'&&ok();

function createLobby(){needName(()=>{

  toast('Создаю лобби…');

    e=>{if(e==='busy')createLobby();else toast('Не удалось создать лобби: '+e)});
})}
function joinLobby(code){needName(()=>{
  code=code.trim().toUpperCase();if(code.length<4)return toast('Введите код лобби');
  toast('Подключаюсь…');
  Net.join(code,c=>{NET={host:false,conn:c};V=null;c.onData=onMsg;c.onClose=()=>{if(NET){toast('Связь с лобби потеряна');leaveToMenu(true)}};c.send({t:'join',id:ME.id,name:ME.name});localStorage.setItem('mafia_last',code)},
    e=>toast(e));
})}
function leaveToMenu(silent){
  const n=NET;NET=null;V=null;lastChat=0;lastNarr=0;lastPhase=null;$('#chatlog').innerHTML='';

/* ---------- рендер ---------- */
const meP=()=>V.players.find(p=>p.id===V.meId);
const PV=id=>V.players.find(p=>p.id===id);
const ptag=id=>{const p=PV(id);return p?`№${p.n} ${esc(p.name)}`:'—'};
const PH={lobby:['🏠','Лобби'],night0:['🌙','Ночь знакомства'],morning:['🌅','Утро'],speech:['🎤','Речи'],general:['💬','Обсуждение'],justify:['⚖️','Оправдание'],vote:['🗳️','Голосование'],voteResult:['📊','Итоги'],lastword:['🕯️','Последнее слово'],n_mafia:['🌙','Ночь'],n_don:['🌙','Ночь'],n_sher:['🌙','Ночь'],n_doc:['🌙','Ночь'],end:['🏁','Конец игры']};
const isNightPh=ph=>ph==='night0'||ph.startsWith('n_');

function render(){
  if(!V)return;
  if(V.phase==='lobby'){show('lobby');document.body.classList.add('night');renderLobby();lastPhase='lobby';return}
  show('game');renderGame();
}
function renderLobby(){
  const host=V.meId===V.hostId,s=V.settings,n=V.players.length;
  const mf=s.mafia==='auto'?(n>=12?3:2):+s.mafia;
  $('#lobbyBox').innerHTML=`
  <div class="topbar"><div class="ph"><div class="ic">🎩</div><div><div class="tt">Лобби</div><div class="st">${host?'Вы создатель лобби':'Ожидание старта'}</div></div></div><button class="btn sm ghost" data-a="leave">Выйти</button></div>
  <div class="card" style="text-align:center"><div class="hint">Код лобби — отправь друзьям</div><div class="code" data-a="copy">${esc(V.code)}</div><div class="hint">нажми на код, чтобы скопировать</div></div>
  <div class="card"><div class="row" style="margin-bottom:4px"><b>Игроки ${n}/${s.maxPlayers}</b><span class="hint" style="text-align:right">нужно 10–12</span></div>
  <ul class="plist">${V.players.map(p=>`<li><span class="tag">${p.n}</span><span class="nm">${esc(p.name)}${p.id===V.meId?' (вы)':''}</span>${p.id===V.hostId?'<span class="tag host">создатель</span>':''}${p.bot?'<span class="tag">🤖 бот</span>':''}${host&&p.id!==V.hostId?`<button class="x" data-a="kick" data-id="${p.id}">×</button>`:''}</li>`).join('')}</ul>
  ${host?`<div class="row" style="margin-top:10px"><button class="btn sm ghost" data-a="addBot" ${n>=s.maxPlayers?'disabled':''}>+ Бот</button><button class="btn sm ghost" data-a="fillBots" ${n>=10?'disabled':''}>Добить ботами до 10</button></div>`:''}</div>
  <div class="card"><b>Правила лобби</b><div class="hint" style="margin-top:6px">🎩 Дон 1 · 🔫 Мафия ${mf} · ⭐ Шериф 1 · 💉 Доктор 1 · 🏠 Мирные ${Math.max(0,n-mf-3)}<br>Речь ${s.speech} с · обсуждение ${s.general} с · оправдание ${s.justifyMin}–${s.justify} с · голосование ${s.vote} с · ночная роль ${s.night} с${s.reveal?' · роль выбывших раскрывается':''}${s.abstain?' · можно воздержаться':''}</div>
  ${host?'<button class="btn sm ghost" style="margin-top:10px" data-a="lobbySettings">Изменить правила</button>':''}</div>
  ${host?`<button class="btn red" data-a="start" ${n<10||n>12?'disabled':''}>${n<10?`Ждём игроков (${n}/10)`:'Начать игру'}</button>`:'<p class="sub" style="text-align:center;margin-top:14px">Создатель лобби начнёт игру, когда все соберутся.</p>'}
  <div class="chat" style="margin-top:14px"><div class="chatlog" id="lchat" style="height:150px"></div><div class="chatin"><input id="lchatIn" maxlength="300" placeholder="Сообщение в лобби" autocomplete="off"><button data-a="lsend">➤</button></div></div>`;
  $('#lchat').innerHTML=V.chat.map(chatLine).join('');$('#lchat').scrollTop=1e6;
  $('#lchatIn').onkeydown=e=>{if(e.key==='Enter')sendLobbyChat()};
}
function sendLobbyChat(){const i=$('#lchatIn');if(i.value.trim())send({a:'chat',text:i.value});i.value=''}
function chatLine(m){if(m.sys)return `<div class="m sys">${esc(m.text)}</div>`;return `<div class="m ${m.ch==='maf'?'mf':''}">${m.ch==='maf'?'🔫 ':''}<b>№${m.n} ${esc(m.name)}:</b> ${esc(m.text)}</div>`}

function renderGame(){
  const me=meP(),ph=V.phase,[ic,tt]=PH[ph];
  document.body.classList.toggle('night',isNightPh(ph));
  if(ph!==lastPhase){beep(isNightPh(ph)?440:740,.14,1);lastPhase=ph}
  $('#gIc').textContent=ic;$('#gTitle').textContent=tt+(ph.startsWith('n_')?' '+V.nightNo:'');
  $('#gSub').textContent=ph==='end'?'':isNightPh(ph)?'Город спит':`День ${V.day} · живых ${V.players.filter(p=>p.alive).length}`;
  if(V.narr&&V.narr.id>lastNarr){lastNarr=V.narr.id;speak(V.narr.text)}
  $('#gNarr').textContent=V.narr?V.narr.text:'';
  $('#gBanner').innerHTML=!V.alive&&ph!=='end'?'<div class="banner">💀 Вы выбыли. Можно наблюдать за игрой.</div>':'';
  $('#gAction').innerHTML=actionHTML(me);
  // места
  const iAmMaf=isMafR(V.role);
  $('#gSeats').innerHTML=V.players.map(p=>{
    const icons=[!p.alive?'💀':'',V.speaker===p.id?'🎤':'',V.nominees.includes(p.id)&&['speech','general','justify','vote'].includes(ph)?'⚖️':'',!p.connected?'📴':'',p.bot?'🤖':''].join('');
    const r=p.role&&(p.id!==V.meId||ph==='end')?`<div class="n">${ROLES[p.role].icon} ${ROLES[p.role].name}</div>`:'';
    return `<div class="seat ${p.alive?'':'dead'} ${V.speaker===p.id?'spk':''} ${p.id===V.meId?'me':''} ${iAmMaf&&isMafR(p.role)&&p.id!==V.meId?'mate':''}"><div class="n">№${p.n}${p.id===V.meId?' · вы':''}</div><div class="s">${esc(p.name)}</div>${r}<div class="ic">${icons}</div></div>`}).join('');
  // чат
  const log=$('#chatlog'),atBottom=log.scrollHeight-log.scrollTop-log.clientHeight<40;
  const fresh=V.chat.filter(m=>m.id>lastChat);if(fresh.length){if(!lastChat)log.innerHTML='';log.insertAdjacentHTML('beforeend',fresh.map(chatLine).join(''));lastChat=fresh[fresh.length-1].id;if(atBottom||fresh.some(m=>m.from===V.meId))log.scrollTop=1e6}
  const inp=$('#chatIn');inp.disabled=!V.perm.ok;$('#chatSend').disabled=!V.perm.ok;
  inp.placeholder=V.perm.ok?(V.perm.ch==='maf'?'🔫 Тайный чат мафии…':'Сообщение…'):V.perm.why;
  tickClock();
}
function sleepCard(t){return `<div class="card sleep"><div class="z">😴</div><p class="sub">${t}</p></div>`}
function chips(list,selId,cls,attrs,disabled=()=>false,extra=()=>''){
  return `<div class="grid">${list.map(p=>`<button class="chip ${p.id===selId?cls:''}" ${attrs} data-id="${p.id}" ${disabled(p)?'disabled':''}><span>№${p.n} ${esc(p.name)}</span><span class="r">${extra(p)}</span></button>`).join('')}</div>`}
function notesHTML(){return V.notes.length?`<div class="notes"><b>Мои проверки</b>${V.notes.map(n=>`<div>${esc(n)}</div>`).join('')}</div>`:''}
function actionHTML(me){
  const ph=V.phase,role=V.role,alive=V.players.filter(p=>p.alive),R=ROLES[role]||{};
  const nomList=V.nominees.length?`<div class="noms">${V.nominees.map(id=>`<span>⚖️ ${ptag(id)}</span>`).join('')}</div>`:'';
  switch(ph){
  case 'night0':{const mates=isMafR(role)?V.players.filter(p=>isMafR(p.role)&&p.id!==V.meId):[];
    return `<div class="card rolecard"><div class="hint">Твоя роль</div><div class="big">${R.icon}</div><div class="nm ${R.team}">${R.name}</div><p class="sub" style="margin-top:8px">${R.desc}</p>${mates.length?`<p class="hint" style="margin-top:10px"><b>Твоя семья:</b> ${mates.map(p=>`№${p.n} ${esc(p.name)} (${ROLES[p.role].name})`).join(', ')}<br>Можете переписываться в тайном чате.</p>`:''}</div>`}
  case 'n_mafia':{
    if(!(isMafR(role)&&V.alive))return sleepCard('Мафия выбирает жертву…');
    const props=V.props||{},cnt=id=>Object.entries(props).filter(([k,v])=>v===id).map(([k])=>'№'+PV(k).n).join(' ');
    const isDon=role==='don',myPick=isDon?V.donPick:props[V.meId];
    return `<div class="card"><b>${isDon?'Вы — дон. Ваш выбор окончательный':'Предложите жертву'}</b><p class="hint" style="margin:4px 0 10px">${isDon?'Смотрите на предложения семьи и выберите цель.':'Окончательное решение за доном.'}${V.donPick!=null?` <b style="color:var(--red)">Решение дона: ${ptag(V.donPick)}</b>`:''}</p>
      ${chips(alive,myPick,'sel','data-a="pick"',()=>false,p=>cnt(p.id))}</div>`}
  case 'n_don':
    if(!(role==='don'&&V.alive))return sleepCard('Дон ищет шерифа…');
    return `<div class="card"><b>Найдите шерифа</b><p class="hint" style="margin:4px 0 10px">Выберите одного игрока для проверки.</p>${V.myCheck==null?chips(alive.filter(p=>p.id!==V.meId),null,'','data-a="pick"'):`<div class="res info">${esc(V.notes[V.notes.length-1]||'')}</div>`}${notesHTML()}</div>`;
  case 'n_sher':
    if(!(role==='sher'&&V.alive))return sleepCard('Шериф ищет мафию…');
    return `<div class="card"><b>Проверьте игрока</b><p class="hint" style="margin:4px 0 10px">Дон и мафия показываются одинаково — «мафия».</p>${V.myCheck==null?chips(alive.filter(p=>p.id!==V.meId),null,'','data-a="pick"'):`<div class="res ${/МАФИЯ/.test(V.notes[V.notes.length-1])?'bad':'good'}">${esc(V.notes[V.notes.length-1]||'')}</div>`}${notesHTML()}</div>`;
  case 'n_doc':
    if(!(role==='doc'&&V.alive))return sleepCard('Доктор выбирает, кого лечить…');
    return `<div class="card"><b>Кого лечим?</b><p class="hint" style="margin:4px 0 10px">Себя можно вылечить только один раз за игру ${V.docSelf?'— <b>уже использовано</b>':'— ещё доступно'}.</p>${chips(alive,V.myCheck,'selg',V.myCheck==null?'data-a="pick"':'',p=>V.myCheck!=null||(p.id===V.meId&&V.docSelf),p=>p.id===V.meId?'вы':'')}</div>`;
  case 'morning':
    if(V.day===1)return `<div class="res info">☀️ День 1 — знакомство</div>`;
    return V.lastNight!=null?`<div class="res bad">Этой ночью убит(а) ${ptag(V.lastNight)}${PV(V.lastNight).role&&V.settings.reveal?` — ${ROLES[PV(V.lastNight).role].name}`:''}</div>`:`<div class="res good">Этой ночью никто не погиб</div>`;
  case 'speech':case 'lastword':case 'justify':{
    const mine=V.speaker===V.meId,sp=PV(V.speaker);
    let h=`<div class="card"><div class="row"><div><div class="hint">${ph==='speech'?'Сейчас говорит':ph==='justify'?'Оправдывается':'Последнее слово'}</div><div style="font-size:20px;font-weight:800">${ptag(V.speaker)}${mine?' — это вы!':''}</div></div></div>`;
    if(mine){h+=`<p class="hint" style="margin-top:8px">Пишите в чат${ph==='justify'?'. Закончить можно после минимального времени.':'.'}</p><button class="btn ${ph==='justify'?'':'ghost'}" data-a="endTurn" id="endBtn">Закончить ${ph==='justify'?'оправдание':'речь'}</button>`;
      if(ph==='speech'&&V.day>=2){const my=V.nomBy[V.meId];
        h+=my!=null?`<p class="hint" style="margin-top:12px">Вы выставили ${ptag(my)} · <a href="#" data-a="unnom" style="color:var(--blue)">отменить</a></p>`:
        `<h2>Выставить на голосование</h2>${chips(alive.filter(p=>p.id!==V.meId&&!V.nominees.includes(p.id)),null,'','data-a="nominate"')}`}}
    if(ph==='speech'&&V.day>=2)h+=nomList||'<p class="hint" style="margin-top:8px">Пока никто не выставлен.</p>';
    return h+'</div>'}
  case 'general':return `<div class="card"><b>Общее обсуждение</b><p class="hint">Пишут все живые игроки.</p>${V.day>=2?(nomList||'<p class="hint">Никто не выставлен.</p>'):''}</div>`;
  case 'vote':{
    if(!V.alive)return `<div class="card"><b>Идёт голосование</b><p class="hint">Проголосовали ${V.voted}/${alive.length}</p>${nomList}</div>`;
    const opts=V.nominees.map(id=>PV(id));
    return `<div class="card"><b>${V.revote?'Переголосование':'За кого голосуете?'}</b><p class="hint" style="margin:4px 0 10px">Проголосовали ${V.voted}/${alive.length}. Голос можно менять до конца таймера.</p>${chips(opts,V.myVote,'sel','data-a="vote"')}
    ${V.settings.abstain?`<button class="btn ghost ${V.myVote==='x'?'':''}" data-a="vote" data-id="x">${V.myVote==='x'?'✓ ':''}Воздержаться</button>`:''}</div>`}
  case 'voteResult':{const r=V.voteResult;
    return `<div class="card"><b>Итоги</b><ul class="vlist" style="margin-top:6px">${r.counts.map(c=>`<li><span>${ptag(c.id)}</span><b>${c.v}</b></li>`).join('')}${r.abst?`<li><span>Воздержались</span><b>${r.abst}</b></li>`:''}</ul>
    <p class="hint" style="margin-top:8px">${Object.entries(r.votes).map(([v,t])=>`№${PV(v).n}→${t==='x'?'—':'№'+PV(t).n}`).join(' · ')}</p>
    ${r.out!=null?`<div class="res bad">Изгнан(а) ${ptag(r.out)}</div>`:r.tie&&!V.revote?'<div class="res info">Равенство — переголосование</div>':'<div class="res good">Никто не уходит</div>'}</div>`}
  case 'end':{const w=V.winner;
    return `<div class="card rolecard"><div class="big">${w==='maf'?'🔫':'🏠'}</div><div class="nm ${w==='maf'?'maf':'town'}">${w==='maf'?'Победила мафия':'Победил мирный город'}</div><p class="sub" style="margin-top:6px">${(w==='maf')===isMafR(V.role)?'🎉 Вы победили!':'Вы проиграли. Реванш?'}</p></div>
    ${V.meId===V.hostId?'<button class="btn red" data-a="toLobby">Вернуться в лобби</button>':'<p class="hint" style="text-align:center;margin-bottom:12px">Создатель лобби может начать новую партию.</p>'}`}
  }
  return '';
}
function tickClock(){
  if(!V||V.phase==='lobby')return;
  const c=$('#gClock'),b=$('#gBar');
  if(V.left==null||V.phase==='end'){c.textContent='';b.style.width='0';return}
  const l=Math.max(0,endAt-Date.now());c.textContent=fmt(l);c.classList.toggle('warn',l<10000);
  b.style.width=(V.total?100*l/V.total:0)+'%';
  const eb=$('#endBtn');if(eb&&V.phase==='justify'){const m=Math.max(0,minAt-Date.now());eb.disabled=m>0;eb.textContent=m>0?`Закончить можно через ${Math.ceil(m/1000)} с`:'Закончить оправдание'}
}
setInterval(tickClock,200);

/* ---------- настройки ---------- */
function openSettings(){
  openModal(`<h2 style="margin-top:0">Настройки</h2>
  <div class="field"><label>Никнейм</label><input id="sName" maxlength="20" value="${esc(ME.name)}"></div>
  <label class="check"><input type="checkbox" id="sVoice" ${ME.voice?'checked':''}> Голос ведущего (озвучка)</label>
  <div class="field"><label>Скорость речи ведущего: <span id="sRateV">${ME.rate}</span></label><input type="range" id="sRate" min="0.7" max="1.5" step="0.05" value="${ME.rate}" style="padding:0"></div>
  <label class="check"><input type="checkbox" id="sSound" ${ME.sound?'checked':''}> Звуковые сигналы</label>
  <button class="btn ghost" data-a="testVoice">🔊 Проверить голос</button>
  <button class="btn" data-a="saveSettings">Сохранить</button>
  <p class="hint" style="margin-top:14px">Версия ${VERSION} · ${LOCAL?'локальный режим (вкладки одного браузера)':'онлайн через P2P'}</p>`);
  $('#sRate').oninput=e=>$('#sRateV').textContent=e.target.value;
}
function openLobbySettings(){const s=V.settings;
  const num=(k,l,min,max)=>`<div class="field"><label>${l}</label><input type="number" id="ls_${k}" min="${min}" max="${max}" value="${s[k]}"></div>`;
  openModal(`<h2 style="margin-top:0">Правила лобби</h2>
  <div class="row"><div class="field"><label>Макс. игроков</label><select id="ls_maxPlayers">${[10,11,12].map(k=>`<option ${k==s.maxPlayers?'selected':''}>${k}</option>`).join('')}</select></div>
  <div class="field"><label>Мафия (без дона)</label><select id="ls_mafia">${['auto','2','3'].map(k=>`<option value="${k}" ${k==s.mafia?'selected':''}>${k==='auto'?'авто':k}</option>`).join('')}</select></div></div>
  <div class="row">${num('speech','Речь, сек',10,300)}${num('general','Обсуждение, сек',10,600)}</div>
  <div class="row">${num('justifyMin','Оправдание мин.',0,180)}${num('justify','Оправдание макс.',10,180)}</div>
  <div class="row">${num('vote','Голосование, сек',10,120)}${num('last','Последнее слово',10,120)}</div>
  <div class="row">${num('night','Ход ночной роли',10,90)}<div></div></div>
  <label class="check"><input type="checkbox" id="ls_reveal" ${s.reveal?'checked':''}> Раскрывать роль выбывших</label>
  <label class="check"><input type="checkbox" id="ls_abstain" ${s.abstain?'checked':''}> Можно воздержаться</label>
  <button class="btn" data-a="saveLobby">Сохранить</button><button class="btn ghost" data-a="resetLobby">Стандартные значения</button>`)}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  if(e.target.matches('[data-bg]'))return closeModal();
  const b=e.target.closest('[data-a]');if(!b)return;if(b.tagName==='A')e.preventDefault();
  const a=b.dataset.a,id=b.dataset.id;
  const tgt=()=>id==='x'?'x':id;
  const A={
    create:createLobby,
    joinOpen(){openModal(`<h2 style="margin-top:0">Присоединиться</h2><div class="field"><label>Код лобби</label><input id="jCode" maxlength="6" style="text-transform:uppercase;letter-spacing:.2em;font-size:22px;text-align:center" value="${esc(localStorage.getItem('mafia_last')||'')}"></div><button class="btn" data-a="joinGo">Войти</button>`);$('#jCode').focus();$('#jCode').onkeydown=e=>e.key==='Enter'&&A.joinGo()},
    joinGo(){const c=$('#jCode').value;closeModal();joinLobby(c)},
    settings:openSettings,
    saveSettings(){const n=$('#sName').value.trim();if(n)ME.name=n;ME.voice=$('#sVoice').checked;ME.sound=$('#sSound').checked;ME.rate=+$('#sRate').value;saveMe();closeModal();toast('Сохранено')},
    testVoice(){ME.rate=+$('#sRate').value;const v=ME.voice;ME.voice=true;speak('Город засыпает. Просыпается мафия.');ME.voice=v},
    exit(){openModal(`<h2 style="margin-top:0">Выйти из игры?</h2><button class="btn red" data-a="exitGo">Выйти</button><button class="btn ghost" data-a="close">Отмена</button>`)},
    exitGo(){closeModal();window.close();setTimeout(()=>show('bye'),150)},
    toMenu(){show('menu')},
    close:closeModal,
    leave(){openModal(`<h2 style="margin-top:0">Покинуть ${V&&V.phase==='lobby'?'лобби':'игру'}?</h2>${NET&&NET.host?'<p class="sub">Вы создатель — лобби закроется для всех.</p>':''}<button class="btn red" data-a="leaveGo">Покинуть</button><button class="btn ghost" data-a="close">Отмена</button>`)},
    leaveGo(){leaveToMenu()},
    copy(){navigator.clipboard?.writeText(V.code).then(()=>toast('Код скопирован'),()=>{})},
    addBot(){send({a:'addBot'})},fillBots(){send({a:'fillBots'})},kick(){send({a:'kick',id})},start(){send({a:'start'})},toLobby(){send({a:'toLobby'})},
    lsend:sendLobbyChat,
    lobbySettings:openLobbySettings,
    saveLobby(){const g=k=>$('#ls_'+k);const s={maxPlayers:+g('maxPlayers').value,mafia:g('mafia').value,reveal:g('reveal').checked,abstain:g('abstain').checked};
      ['speech','general','justifyMin','justify','vote','last','night'].forEach(k=>s[k]=Math.max(+g(k).min,Math.min(+g(k).max,+g(k).value||DEF[k])));
      if(s.justifyMin>s.justify)s.justifyMin=s.justify;send({a:'settings',s});closeModal()},
    resetLobby(){send({a:'settings',s:{...DEF}});closeModal()},
    pick(){send({a:'pick',target:id})},vote(){send({a:'vote',target:tgt()})},nominate(){send({a:'nominate',target:id})},unnom(){send({a:'unnominate'})},
    endTurn(){send({a:'end'})},
    myRole(){if(!V||!V.role)return;const R=ROLES[V.role];const mates=isMafR(V.role)?V.players.filter(p=>isMafR(p.role)&&p.id!==V.meId):[];
      openModal(`<div class="rolecard"><div class="big">${R.icon}</div><div class="nm ${R.team}">${R.name}</div><p class="sub" style="margin-top:8px">${R.desc}</p>${mates.length?`<p class="hint" style="margin-top:8px">Семья: ${mates.map(p=>`№${p.n} ${esc(p.name)}`).join(', ')}</p>`:''}${notesHTML()}</div><button class="btn ghost" data-a="close">Скрыть</button>`)}
  };
  A[a]&&A[a]();
});
function sendChat(){const i=$('#chatIn');if(i.value.trim()&&V&&V.perm.ok)send({a:'chat',text:i.value});i.value=''}
$('#chatSend').onclick=sendChat;$('#chatIn').onkeydown=e=>{if(e.key==='Enter')sendChat()};
window.addEventListener('beforeunload',e=>{if(NET&&NET.host&&V&&V.phase!=='lobby'){e.preventDefault();e.returnValue=''}});
$('#ver').textContent=`v${VERSION}${LOCAL?' · локальный режим':''}`;
const qs=new URLSearchParams(location.search).get('join');if(qs)setTimeout(()=>joinLobby(qs),300);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
