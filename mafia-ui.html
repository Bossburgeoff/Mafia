              <span class="target-check"></span>
            </button>
          `).join("")}
        </div>
      `;
    }

    function renderNightAction() {
      const me = userPlayer();
      const alive = getAlivePlayers();

      if (!me.alive) {
        return `
          <section class="card action-card">
            <h2>Ночь · вы наблюдаете</h2>
            <p>Вы выбыли из партии. Остальные игроки сделают ночной ход автоматически.</p>
            <div class="auto-note">Ночь закончится по таймеру.</div>
          </section>
        `;
      }

      if (me.role === "citizen") {
        return `
          <section class="card action-card">
            <h2>Ночь · вы отдыхаете</h2>
            <p>У мирного жителя нет ночного действия. Ночь завершится автоматически.</p>
            <div class="auto-note">Следующая фаза начнётся, когда закончится таймер ночи.</div>
          </section>
        `;
      }

      let candidates = [];
      let instruction = "";
      let actionName = "";

      if (me.role === "mafia") {
        candidates = alive.filter(player => player.role !== "mafia");
        instruction = "Выберите игрока, которого мафия попытается устранить.";
        actionName = "Цель мафии";
      } else if (me.role === "doctor") {
        candidates = alive;
        instruction = "Выберите игрока, которого хотите защитить этой ночью.";
        actionName = "Кого спасти";
      } else if (me.role === "sheriff") {
        candidates = alive.filter(player => !player.isUser);
        instruction = "Выберите игрока для тайной проверки.";
        actionName = "Кого проверить";
      }

      const selected = game.players.find(player => player.id === game.nightTarget);
      const chosenName = selected ? selected.name : "";

      let mafiaTeamNote = "";

      if (me.role === "mafia") {
        const allies = alive
          .filter(player => player.role === "mafia" && !player.isUser)
          .map(player => escapeHTML(player.name));

        mafiaTeamNote = `
          <div class="private-strip">
            Ваша команда: вы${allies.length ? `, ${allies.join(", ")}` : ""}.
            Информация видна только вам.
          </div>
        `;
      }

      return `
        <section class="card action-card">
          <div class="card-head">
            <h2>${actionName}</h2>
            <span class="small muted">действие выполнится по таймеру</span>
          </div>

          <p>${instruction}</p>
          ${mafiaTeamNote}

          ${renderTargetSelection(
            candidates,
            game.nightTarget,
            "select-night-target",
            "Нажмите, чтобы выбрать"
          )}

          <div class="selection-state">
            ${chosenName
              ? `Вы выбрали: <strong>${escapeHTML(chosenName)}</strong>. Действие применится автоматически.`
              : "Выберите игрока. Если не успеете, игра выполнит случайное действие."
            }
          </div>

          ${me.role === "sheriff" && game.nightTarget
            ? `<div class="notice">Результат проверки появится после завершения ночи и будет виден только вам.</div>`
            : ""}
        </section>
      `;
    }

    function renderDayAction() {
      const me = userPlayer();
      const result = game.lastNightResult;

      let summary = `<div class="notice">Утро наступило. Ночью никто не выбыл.</div>`;

      if (result && result.type === "death") {
        summary = `
          <div class="notice warning">
            Ночью выбыл игрок <strong>${escapeHTML(result.playerName)}</strong>.
            Его роль: <strong>${escapeHTML(ROLE_INFO[result.role].name)}</strong>.
          </div>
        `;
      } else if (result && result.type === "safe") {
        summary = `<div class="notice success">${escapeHTML(result.text)}</div>`;
      }

      const notes = me.role === "sheriff" && game.privateNotes.length
        ? `
          <div class="notice">
            <strong>Ваши проверки:</strong><br>
            ${game.privateNotes.slice(-3).map(note => `
              Ночь ${note.round}: ${escapeHTML(note.name)} — ${escapeHTML(note.result)}.
            `).join("<br>")}
          </div>
        `
        : "";

      return `
        <section class="card action-card">
          <div class="card-head">
            <h2>Утро в городе</h2>
            <span class="small muted">обсуждение</span>
          </div>

          ${summary}
          ${notes}

          <p>
            Обсудите события в чате. Когда время обсуждения закончится,
            голосование начнётся автоматически.
          </p>

          ${!me.alive
            ? `<div class="notice">Вы выбыли и не можете голосовать, но можете следить за партией.</div>`
            : ""
          }

          <button class="btn secondary" type="button" data-page="chat">▣ Открыть чат</button>
        </section>
      `;
    }

    function renderVoteAction() {
      const me = userPlayer();
      const candidates = getAlivePlayers().filter(player => !player.isUser);

      if (!me.alive) {
        return `
          <section class="card action-card">
            <h2>Голосование</h2>
            <p>Вы выбыли и не голосуете. Голоса остальных участников будут подсчитаны автоматически.</p>
          </section>
        `;
      }

      const selected = game.players.find(player => player.id === game.voteTarget);

      return `
        <section class="card action-card">
          <div class="card-head">
            <h2>Кого выдвинуть?</h2>
            <span class="small muted">${getAlivePlayers().length} игроков в игре</span>
          </div>

          <p>Выберите одного игрока. Голос будет учтён автоматически по окончании таймера.</p>

          ${renderTargetSelection(
            candidates,
            game.voteTarget,
            "select-vote-target",
            "Нажмите, чтобы проголосовать"
          )}

          <div class="selection-state">
            ${selected
              ? `Ваш голос: <strong>${escapeHTML(selected.name)}</strong>. Выбор можно изменить до конца таймера.`
              : "Вы ещё не выбрали игрока. Если время закончится, голос будет выбран автоматически."
            }
          </div>
        </section>
      `;
    }

    function renderVoteResults() {
      const result = game.lastVoteResult;

      if (!result) {
        return `
          <section class="card">
            <h2>Подсчёт голосов</h2>
            <p class="muted">Результат появится здесь.</p>
          </section>
        `;
      }

      const rows = [...result.counts].sort((a, b) => b.votes - a.votes);

      return `
        <section class="card">
          <div class="card-head">
            <h2>Результаты голосования</h2>
            <span class="small muted">раунд ${game.round}</span>
          </div>

          ${result.tied
            ? `<div class="notice warning">Ничья. В этом раунде никто не выбыл.</div>`
            : result.eliminatedName
              ? `<div class="notice warning">
                   Выбыл <strong>${escapeHTML(result.eliminatedName)}</strong>.
                   Его роль: <strong>${escapeHTML(ROLE_INFO[result.eliminatedRole].name)}</strong>.
                 </div>`
              : `<div class="notice">Никто не выбыл.</div>`
          }

          <div class="card" style="padding:4px;background:rgba(2,24,51,.65)">
            ${rows.map(row => `
              <div class="vote-result-row">
                <span class="avatar ${row.isUser ? "user-avatar" : ""}">${row.isUser ? "★" : "♟"}</span>
                <span>${escapeHTML(row.name)}</span>
                <span class="vote-count">${row.votes} ${row.votes === 1 ? "голос" : "голосов"}</span>
              </div>
            `).join("")}
          </div>

          <div class="notice">
            Новый раунд начнётся автоматически, когда закончится таймер этой фазы.
          </div>
        </section>
      `;
    }

    function renderCurrentAction() {
      if (game.phase === "night") return renderNightAction();
      if (game.phase === "day") return renderDayAction();
      if (game.phase === "vote") return renderVoteAction();
      if (game.phase === "results") return renderVoteResults();

      return "";
    }

    function renderJournalCard() {
      const items = game ? [...game.log].slice(-12).reverse() : [];

      if (!items.length) {
        return `
          <section class="card journal-card">
            <div class="journal-head">
              <div class="journal-title"><span>▤</span>Журнал партии</div>
              <span class="journal-count">0 событий</span>
            </div>
            <div class="empty-state">События появятся после начала игры.</div>
          </section>
        `;
      }

      return `
        <section class="card journal-card">
          <div class="journal-head">
            <div class="journal-title"><span>▤</span>Журнал партии</div>
            <span class="journal-count">${game.log.length} событий</span>
          </div>

          <div class="journal-list">
            ${items.map((item, index) => `
              <div class="journal-entry ${escapeHTML(item.type || "info")} ${index === 0 ? "latest" : ""}">
                <span class="journal-dot"></span>
                <div class="journal-content">
                  <time>${escapeHTML(item.time)}</time>
                  <p>${escapeHTML(item.text)}</p>
                </div>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function canSeeRole(player) {
      if (!game) return false;
      if (game.status === "finished" || !player.alive || player.isUser) return true;

      const me = userPlayer();
      return me && me.role === "mafia" && player.role === "mafia";
    }

    function renderPlayerList() {
      if (!game) return "";

      return `
        <section class="card">
          <div class="card-head">
            <h2>Участники</h2>
            <span class="small muted">${getAlivePlayers().length} в игре</span>
          </div>

          ${game.players.map(player => {
            const visible = canSeeRole(player);
            const role = ROLE_INFO[player.role];

            return `
              <div class="player-row">
                <span class="avatar ${player.isUser ? "user-avatar" : ""} ${player.alive ? "" : "dead"}">
                  ${player.isUser ? "★" : "♟"}
                </span>
                <span class="player-row-name">${escapeHTML(player.name)}${player.isUser ? " (вы)" : ""}</span>
                ${visible
                  ? `<span class="role-label ${role.tone}">${escapeHTML(role.name)}</span>`
                  : ""
                }
                <span class="player-status ${player.alive ? "" : "dead"}">
                  ${player.alive ? "В игре" : "Выбыл"}
                </span>
              </div>
            `;
          }).join("")}
        </section>
      `;
    }

    function renderGame() {
      if (!game) {
        return `
          <section class="card">
            <h2>Партия ещё не началась</h2>
            <p class="muted">Настройте количество игроков и начните новую игру.</p>
            <button class="btn" type="button" data-page="lobby">Перейти в лобби</button>
          </section>
        `;
      }

      if (game.status === "finished") {
        return renderFinishedGame();
      }

      return `
        <div class="game-layout">
          <div class="game-phase-wide">${renderPhaseBanner()}</div>
          <div class="game-role-wide">${renderRolePanel()}</div>

          <aside class="game-aside">
            ${renderJournalCard()}
          </aside>

          <div class="game-main">
            ${renderCurrentAction()}
            ${renderPlayerList()}
          </div>
        </div>
      `;
    }

    function renderFinishedGame() {
      const me = userPlayer();
      const userWon =
        (game.winner === "mafia" && me.role === "mafia") ||
        (game.winner === "town" && me.role !== "mafia");

      const winnerText = game.winner === "mafia"
        ? "Победила мафия"
        : "Победили мирные жители";

      return `
        <div class="game-layout">
          <section class="card result-card game-phase-wide ${userWon ? "" : "lost"}">
            <div class="result-icon">${userWon ? "🏆" : "☠"}</div>
            <h2>${userWon ? "Ваша команда победила!" : "Ваша команда проиграла"}</h2>
            <p>${winnerText}. Партия продлилась ${game.round} раундов.</p>
          </section>

          <div class="game-role-wide">${renderRolePanel()}</div>

          <aside class="game-aside">
            ${renderJournalCard()}
          </aside>

          <div class="game-main">
            <section class="card">
              <div class="card-head">
                <h2>Раскрытые роли</h2>
                <span class="small muted">${game.players.length} игроков</span>
              </div>

              <div class="role-reveal-list">
                ${game.players.map(player => `
                  <div class="role-reveal-item ${player.alive ? "" : "dead-player"}">
                    <span class="avatar ${player.isUser ? "user-avatar" : ""} ${player.alive ? "" : "dead"}">
                      ${player.isUser ? "★" : "♟"}
                    </span>
                    <span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
                      ${escapeHTML(player.name)}${player.isUser ? " (вы)" : ""}
                    </span>
                    <span class="role-label ${ROLE_INFO[player.role].tone}">
                      ${escapeHTML(ROLE_INFO[player.role].name)}
                    </span>
                  </div>
                `).join("")}
              </div>
            </section>

            <div class="button-row">
              <button class="btn" type="button" data-action="start-game">↻ Сыграть ещё раз</button>
              <button class="btn secondary" type="button" data-page="stats">Статистика</button>
              <button class="btn secondary" type="button" data-page="lobby">Настройки партии</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderPlayers() {
      if (!game) {
        return `
          <section class="card">
            <div class="empty-state">Участников пока нет. Начните партию, чтобы создать список игроков.</div>
            <button class="btn" type="button" data-page="lobby">Создать партию</button>
          </section>
        `;
      }

      return `
        <section class="card">
          <div class="card-head">
            <h2>Участники (${getAlivePlayers().length}/${game.players.length})</h2>
            <span class="small muted">${game.status === "finished" ? "партия завершена" : "роли живых игроков скрыты"}</span>
          </div>
          ${renderPlayerList()}
        </section>
      `;
    }

    function renderChatMessage(message) {
      const isMine = message.senderId === "user";
      const isSystem = message.system;

      return `
        <div class="message ${isMine ? "mine" : ""} ${isSystem ? "system-message" : ""}">
          ${!isMine && !isSystem ? `<span class="avatar">♟</span>` : ""}
          <div class="bubble">
            <div class="message-meta">
              <strong>${escapeHTML(message.author)}</strong>
              <time>${escapeHTML(message.time)}</time>
            </div>
            <p>${escapeHTML(message.text)}</p>
          </div>
        </div>
      `;
    }

    function renderChat() {
      if (!game) {
        return `
          <section class="card">
            <div class="empty-state">Чат откроется после начала партии.</div>
            <button class="btn" type="button" data-page="lobby">Начать партию</button>
          </section>
        `;
      }

      const me = userPlayer();
      const mode = game.chatMode || "public";
      const isMafia = me.role === "mafia";
      const messages = game.messages.filter(message => message.channel === mode);

      const canSend = game.status === "playing" &&
        me.alive &&
        (mode === "mafia"
          ? isMafia
          : game.phase === "day");

      return `
        <section class="card">
          <div class="tabs">
            <button
              type="button"
              class="${mode === "public" ? "active" : ""}"
              data-action="chat-mode"
              data-mode="public"
            >Общий чат</button>

            ${isMafia ? `
              <button
                type="button"
                class="${mode === "mafia" ? "active" : ""}"
                data-action="chat-mode"
                data-mode="mafia"
              >Чат мафии</button>
            ` : ""}
          </div>

          <div class="chat-list" id="chatList">
            ${messages.length
              ? messages.map(renderChatMessage).join("")
              : `<div class="empty-state">Сообщений пока нет.</div>`
            }
          </div>

          ${canSend ? `
            <form class="chat-composer" id="chatForm">
              <input
                id="chatInput"
                maxlength="240"
                autocomplete="off"
                placeholder="${mode === "mafia" ? "Сообщение для команды..." : "Написать сообщение..."}"
                aria-label="Текст сообщения"
              >
              <button type="submit" aria-label="Отправить сообщение">➤</button>
            </form>
          ` : `
            <div class="notice">
              ${game.status === "finished"
                ? "Партия завершена. Чат доступен только для просмотра."
                : !me.alive
                  ? "Вы выбыли и можете только читать сообщения."
                  : mode === "public"
                    ? "Общий чат доступен во время дневного обсуждения."
                    : "Чат мафии доступен живым игрокам-мафиози."
              }
            </div>
          `}
        </section>
      `;
    }

    function renderStats() {
      const winRate = stats.played
        ? Math.round((stats.wins / stats.played) * 100)
        : 0;

      const mostPlayedRole = Object.entries(stats.rolePlayed)
        .sort((a, b) => b[1] - a[1])[0];

      return `
        <div class="dashboard-grid">
          <section class="card wide-card">
            <div class="card-head">
              <h2>Моя статистика</h2>
              <span class="small muted">сохраняется в браузере</span>
            </div>

            <div class="stat-grid">
              <div class="stat-box"><strong>${stats.played}</strong><small>сыграно партий</small></div>
              <div class="stat-box"><strong>${stats.wins}</strong><small>побед</small></div>
              <div class="stat-box"><strong>${winRate}%</strong><small>процент побед</small></div>
            </div>

            <div class="notice">
              Чаще всего вы играли роль:
              <strong>${mostPlayedRole ? escapeHTML(ROLE_INFO[mostPlayedRole[0]]?.name || mostPlayedRole[0]) : "пока нет данных"}</strong>.
            </div>
          </section>

          <section class="card">
            <div class="card-head"><h2>Победы по ролям</h2></div>
            ${Object.keys(ROLE_INFO).map(role => `
              <div class="stat-row">
                <span class="stat-icon">${roleArt(role, "role-art mini-art")}</span>
                <span>${escapeHTML(ROLE_INFO[role].name)}</span>
                <span>${stats.roleWins[role] || 0}</span>
              </div>
            `).join("")}
          </section>

          <section class="card">
            <div class="card-head">
              <h2>Журнал партий</h2>
              <span class="small muted">${history.length} записей</span>
            </div>
            ${history.length
              ? renderRecentHistory(20)
              : `<div class="empty-state">Сыграйте первую партию, чтобы увидеть статистику.</div>`
            }
          </section>
        </div>
      `;
    }

    function renderSettings() {
      return `
        <div class="two-column">
          <section class="card">
            <div class="card-head"><h2>Профиль</h2></div>

            <form id="profileForm">
              <label class="field">
                <span>Имя игрока</span>
                <input id="settingName" maxlength="20" value="${escapeHTML(config.name)}">
              </label>
              <button class="btn" type="submit">Сохранить имя</button>
            </form>
          </section>

          <section class="card">
            <div class="card-head"><h2>Звук и управление</h2></div>

            <div class="settings-row">
              <span class="setting-icon">🔊</span>
              <span>Звуковые сигналы</span>
              <label class="switch" aria-label="Звуковые сигналы">
                <input type="checkbox" data-setting="sound" ${settings.sound ? "checked" : ""}>
                <span></span>
              </label>
            </div>

            <div class="settings-row">
              <span class="setting-icon">▧</span>
              <span>Вибрация на телефоне</span>
              <label class="switch" aria-label="Вибрация">
                <input type="checkbox" data-setting="vibration" ${settings.vibration ? "checked" : ""}>
                <span></span>
              </label>
            </div>
          </section>

          <section class="card wide-card">
            <div class="card-head"><h2>Данные приложения</h2></div>
            <p class="muted">
              Имя, настройки, статистика и журнал партий хранятся в этом браузере.
            </p>
            <button class="btn danger" type="button" data-action="reset-stats">
              Очистить статистику и журнал
            </button>
          </section>
        </div>
      `;
    }

    function renderPage() {
      switch (page) {
        case "lobby": return renderLobby();
        case "game": return renderGame();
        case "roles": return renderRoles();
        case "chat": return renderChat();
        case "players": return renderPlayers();
        case "stats": return renderStats();
        case "settings": return renderSettings();
        default: return renderHome();
      }
    }

    function refreshClockUI() {
      const badge = $("#phaseBadge");

      if (!game) {
        if (badge) badge.textContent = "Партия не начата";
        return;
      }

      if (game.status === "finished") {
        if (badge) badge.textContent = "Партия завершена";
        return;
      }

      const phaseName = PHASE_INFO[game.phase]?.name || "";
      const seconds = phaseSecondsLeft();

      if (badge) {
        badge.textContent = `Раунд ${game.round} · ${phaseName} · ${formatClock(seconds)}`;
      }

      $$("[data-phase-clock]").forEach(element => {
        element.textContent = formatClock(seconds);
      });

      const progress = `${phaseProgress()}%`;

      $$("[data-phase-progress]").forEach(element => {
        element.style.width = progress;
      });
    }

    function render() {
      $("#pageTitle").textContent = PAGE_TITLES[page] || PAGE_TITLES.home;
      $("#pageEyebrow").textContent = game ? "Локальная партия" : "Игровое приложение";
      $("#appView").innerHTML = renderPage();

      $$(".nav-link, .mobile-link").forEach(link => {
        link.classList.toggle("active", link.dataset.page === page);
      });

      const chatList = $("#chatList");
      if (chatList) chatList.scrollTop = chatList.scrollHeight;

      refreshClockUI();
    }

    function createGame() {
      const total = config.playerCount;
      const counts = roleCounts(total);
      const roleDeck = [];

      Object.entries(counts).forEach(([role, count]) => {
        for (let index = 0; index < count; index++) {
          roleDeck.push(role);
        }
      });

      const botNames = [
        "Алиса", "Борис", "Вера", "Глеб", "Диана", "Егор", "Жанна",
        "Илья", "Кира", "Лев", "Мила", "Никита", "Ольга", "Павел"
      ];

      const players = [{
        id: "p0",
        name: config.name.trim() || "Вы",
        isUser: true,
        alive: true,
        role: ""
      }];

      for (let index = 1; index < total; index++) {
        players.push({
          id: `p${index}`,
          name: botNames[index - 1] || `Игрок ${index + 1}`,
          isUser: false,
          alive: true,
          role: ""
        });
      }

      const roles = shuffle(roleDeck);

      players.forEach((player, index) => {
        player.role = roles[index];
      });

      const now = Date.now();

      game = {
        status: "playing",
        phase: "night",
        round: 1,
        phaseStartedAt: now,
        phaseEndsAt: now + PHASE_SECONDS.night * 1000,
        phaseResolving: false,
        players,
        nightTarget: null,
        voteTarget: null,
        lastNightResult: null,
        lastVoteResult: null,
        privateNotes: [],
        messages: [],
        log: [],
        chatMode: "public",
        winner: null,
        recorded: false
      };

      addSystem("Партия началась. Игрокам выданы роли. Наступает ночь.", "night");
    }

    function startGame() {
      const nameInput = $("#playerName");
      const countInput = $("#playerCount");

      if (nameInput) {
        config.name = nameInput.value.trim().slice(0, 20) || "Вы";
      }

      if (countInput) {
        config.playerCount = Math.min(15, Math.max(5, Number(countInput.value) || 8));
      }

      if (game && game.status === "playing") {
        const approved = window.confirm("Текущая партия будет сброшена. Начать новую?");
        if (!approved) return;
      }

      saveData("mafiaConfig", config);
      createGame();
      page = "game";
      feedback();
      render();

      toast(`Ваша роль: ${ROLE_INFO[userPlayer().role].name}`);
    }

    function setPhase(phase) {
      if (!game || game.status !== "playing") return;

      game.phase = phase;
      game.phaseStartedAt = Date.now();
      game.phaseEndsAt = game.phaseStartedAt + PHASE_SECONDS[phase] * 1000;
      game.phaseResolving = false;

      render();
    }

    function checkWinner() {
      const alive = getAlivePlayers();
      const mafiaCount = alive.filter(player => player.role === "mafia").length;
      const townCount = alive.length - mafiaCount;

      if (mafiaCount === 0) return "town";
      if (mafiaCount >= townCount) return "mafia";
      return null;
    }

    function finishGame(winner) {
      if (!game || game.recorded) return;

      game.status = "finished";
      game.phase = "finished";
      game.phaseEndsAt = null;
      game.winner = winner;
      game.recorded = true;

      const me = userPlayer();
      const userWon =
        (winner === "mafia" && me.role === "mafia") ||
        (winner === "town" && me.role !== "mafia");

      stats.played += 1;
      stats.rolePlayed[me.role] = (stats.rolePlayed[me.role] || 0) + 1;

      if (userWon) {
        stats.wins += 1;
        stats.roleWins[me.role] = (stats.roleWins[me.role] || 0) + 1;
      }

      const resultText = winner === "mafia" ? "Победа мафии" : "Победа мирных";

      history.unshift({
        date: new Date().toISOString(),
        role: me.role,
        winner,
        won: userWon,
        result: resultText,
        rounds: game.round,
        playerCount: game.players.length
      });

      history = history.slice(0, 100);

      saveData("mafiaStats", stats);
      saveData("mafiaHistory", history);

      addSystem(`${resultText}. Партия завершена.`, "result");
    }

    function chooseMafiaTarget(alive) {
      const candidates = alive.filter(player => player.role !== "mafia");
      if (!candidates.length) return null;

      const important = candidates.filter(player =>
        player.role === "sheriff" || player.role === "doctor"
      );

      if (important.length && Math.random() < 0.6) {
        return randomItem(important);
      }

      return randomItem(candidates);
    }

    function generateDayConversation() {
      const bots = getAlivePlayers().filter(player => !player.isUser);
      if (!bots.length) return;

      const firstSpeaker = randomItem(bots);
      const wasKilled = game.lastNightResult && game.lastNightResult.type === "death";

      const lines = wasKilled
        ? [
            `Ночью выбыл ${game.lastNightResult.playerName}. Надо понять, кому это было выгодно.`,
            `Жаль, что ${game.lastNightResult.playerName} выбыл. Есть подозрения?`,
            "Давайте обсудим вчерашние голоса."
          ]
        : [
            "Эта ночь прошла тихо. Кто ведёт себя подозрительно?",
            "Пока не понимаю, кому можно доверять.",
            "Нужно внимательнее смотреть на голоса."
          ];

      addMessage("public", firstSpeaker.id, firstSpeaker.name, randomItem(lines));

      if (bots.length > 1 && Math.random() > 0.25) {
        const secondSpeaker = randomItem(bots.filter(player => player.id !== firstSpeaker.id));
        const replies = [
          "Я бы пока не спешил с выводами.",
          "Надо обратить внимание на тех, кто мало говорит.",
          "Давайте голосовать внимательно.",
          "У меня есть подозрение, но пока недостаточно доказательств."
        ];

        addMessage("public", secondSpeaker.id, secondSpeaker.name, randomItem(replies));
      }
    }

    function resolveNight() {
      if (!game || game.status !== "playing" || game.phase !== "night") return;

      const winnerBeforeNight = checkWinner();

      if (winnerBeforeNight) {
        finishGame(winnerBeforeNight);
        render();
        return;
      }

      const alive = getAlivePlayers();
      const me = userPlayer();

      let killTarget = null;

      if (me.alive && me.role === "mafia") {
        killTarget = alive.find(player =>
          player.id === game.nightTarget && player.role !== "mafia"
        ) || null;
      }

      if (!killTarget) {
        killTarget = chooseMafiaTarget(alive);
      }

      const doctor = alive.find(player => player.role === "doctor");
      let savedPlayerId = null;

      if (doctor) {
        if (doctor.isUser) {
          const selected = alive.find(player => player.id === game.nightTarget);
          if (selected) {
            savedPlayerId = selected.id;
          } else if (killTarget && Math.random() < 0.2) {
            savedPlayerId = killTarget.id;
          } else {
            savedPlayerId = randomItem(alive)?.id || null;
          }
        } else if (killTarget && Math.random() < 0.25) {
          savedPlayerId = killTarget.id;
        } else {
          savedPlayerId = randomItem(alive)?.id || null;
        }
      }

      const sheriff = alive.find(player => player.role === "sheriff");

      if (sheriff && sheriff.isUser) {
        let investigated = alive.find(player =>
          player.id === game.nightTarget && !player.isUser
        ) || null;

        if (!investigated) {
          investigated = randomItem(alive.filter(player => !player.isUser));
        }

        if (investigated) {
          game.privateNotes.push({
            round: game.round,
            name: investigated.name,
            result: investigated.role === "mafia" ? "мафия" : "не мафия"
          });
        }
      }

      if (!killTarget) {
        game.lastNightResult = {
          type: "safe",
          text: "Ночью никто не выбыл."
        };
      } else if (savedPlayerId === killTarget.id) {
        game.lastNightResult = {
          type: "safe",
          text: "Ночь прошла спокойно: доктор спас цель мафии."
        };
      } else {
        killTarget.alive = false;
        game.lastNightResult = {
          type: "death",
          playerId: killTarget.id,
          playerName: killTarget.name,
          role: killTarget.role,
          text: `Ночью выбыл игрок ${killTarget.name}.`
        };
      }

      game.nightTarget = null;

      if (game.lastNightResult.type === "death") {
        addSystem(
          `Наступило утро. Выбыл ${game.lastNightResult.playerName}. Его роль: ${ROLE_INFO[game.lastNightResult.role].name}.`,
          "day"
        );
      } else {
        addSystem(game.lastNightResult.text, "day");
      }

      const winner = checkWinner();

      if (winner) {
        finishGame(winner);
        feedback();
        render();
        return;
      }

      generateDayConversation();
      game.chatMode = "public";
      setPhase("day");
      feedback();
    }

    function startVoteAutomatically() {
      if (!game || game.phase !== "day") return;

      addSystem("Обсуждение завершено. Началось голосование.", "vote");
      game.voteTarget = null;
      game.chatMode = "public";
      setPhase("vote");
    }

    function chooseBotVote(bot, alive) {
      let candidates = alive.filter(player => player.id !== bot.id);

      if (bot.role === "mafia") {
        const nonMafia = candidates.filter(player => player.role !== "mafia");
        if (nonMafia.length) candidates = nonMafia;
      }

      return randomItem(candidates);
    }

    function resolveVote() {
      if (!game || game.status !== "playing" || game.phase !== "vote") return;

      const alive = getAlivePlayers();
      const me = userPlayer();
      const tally = {};

      alive.forEach(player => {
        if (player.isUser) {
          if (me.alive) {
            let target = alive.find(candidate => candidate.id === game.voteTarget);

            if (!target) {
              target = randomItem(alive.filter(candidate => !candidate.isUser));
            }

            if (target) {
              tally[target.id] = (tally[target.id] || 0) + 1;
            }
          }

          return;
        }

        const target = chooseBotVote(player, alive);
        if (target) {
          tally[target.id] = (tally[target.id] || 0) + 1;
        }
      });

      const maxVotes = Math.max(0, ...Object.values(tally));
      const leaders = Object.keys(tally).filter(id => tally[id] === maxVotes && maxVotes > 0);
      const tied = leaders.length > 1;
      let eliminated = null;

      if (leaders.length === 1) {
        eliminated = game.players.find(player => player.id === leaders[0]) || null;
        if (eliminated) eliminated.alive = false;
      }

      game.lastVoteResult = {
        tied,
        eliminatedId: eliminated ? eliminated.id : null,
        eliminatedName: eliminated ? eliminated.name : null,
        eliminatedRole: eliminated ? eliminated.role : null,
        counts: alive.map(player => ({
          id: player.id,
          name: player.name,
          isUser: player.isUser,
          votes: tally[player.id] || 0
        }))
      };

      game.voteTarget = null;

      if (tied) {
        addSystem("Голосование завершилось ничьей. Никто не выбыл.", "vote");
      } else if (eliminated) {
        addSystem(
          `По итогам голосования выбыл ${eliminated.name}. Его роль: ${ROLE_INFO[eliminated.role].name}.`,
          "vote"
        );
      } else {
        addSystem("В этом раунде никто не выбыл.", "vote");
      }

      const winner = checkWinner();

      if (winner) {
        finishGame(winner);
      } else {
        setPhase("results");
      }

      feedback();
      render();
    }

    function nextNightAutomatically() {
      if (!game || game.phase !== "results") return;

      game.round += 1;
      game.nightTarget = null;
      game.voteTarget = null;
      game.chatMode = "public";

      addSystem(`Наступила ночь ${game.round}.`, "night");
      setPhase("night");
    }

    function handlePhaseTimeout() {
      if (!game || game.status !== "playing") return;

      game.phaseResolving = true;

      switch (game.phase) {
        case "night":
          resolveNight();
          break;
        case "day":
          startVoteAutomatically();
          break;
        case "vote":
          resolveVote();
          break;
        case "results":
          nextNightAutomatically();
          break;
      }
    }

    function tickPhase() {
      if (!game || game.status !== "playing" || !game.phaseEndsAt) return;

      refreshClockUI();

      if (Date.now() >= game.phaseEndsAt && !game.phaseResolving) {
        handlePhaseTimeout();
      }
    }

    function sendChatMessage(event) {
      event.preventDefault();

      if (!game) return;

      const input = $("#chatInput");
      const text = input ? input.value.trim() : "";
      if (!text) return;

      const me = userPlayer();
      const channel = game.chatMode || "public";

      const canSend =
        game.status === "playing" &&
        me.alive &&
        (channel === "mafia"
          ? me.role === "mafia"
          : game.phase === "day");

      if (!canSend) {
        toast("Сейчас нельзя отправить сообщение.");
        return;
      }

      addMessage(channel, "user", me.name, text);

      const bots = getAlivePlayers().filter(player =>
        !player.isUser &&
        (channel === "public" || player.role === "mafia")
      );

      if (bots.length && Math.random() > 0.25) {
        const speaker = randomItem(bots);
        const replies = channel === "mafia"
          ? [
              "Понял. Буду действовать осторожно.",
              "Согласен, постараюсь поддержать эту версию.",
              "Нужно не привлекать к себе внимания."
            ]
          : [
              "Я услышал. Давайте посмотрим на голоса.",
              "Возможно, но пока нужны доказательства.",
              "Понял. Есть ещё мнения?",
              "Давайте обсудим это перед голосованием."
            ];

        addMessage(channel, speaker.id, speaker.name, randomItem(replies));
      }

      render();
    }

    document.addEventListener("click", event => {
      const actionButton = event.target.closest("[data-action]");

      if (actionButton) {
        const action = actionButton.dataset.action;

        if (action === "start-game") {
          startGame();
          return;
        }

        if (action === "select-night-target" && game && game.phase === "night") {
          game.nightTarget = actionButton.dataset.id;
          feedback();
          render();
          return;
        }

        if (action === "select-vote-target" && game && game.phase === "vote") {
          game.voteTarget = actionButton.dataset.id;
          feedback();
          render();
          return;
        }

        if (action === "chat-mode" && game) {
          game.chatMode = actionButton.dataset.mode;
          render();
          return;
        }

        if (action === "reset-stats") {
          const approved = window.confirm("Удалить статистику и журнал всех партий?");
          if (!approved) return;

          stats.played = 0;
          stats.wins = 0;
          stats.rolePlayed = {};
          stats.roleWins = {};
          history = [];

          saveData("mafiaStats", stats);
          saveData("mafiaHistory", history);
          toast("Статистика очищена.");
          render();
        }

        return;
      }

      const pageButton = event.target.closest("[data-page]");

      if (pageButton) {
        page = pageButton.dataset.page;
        render();
      }
    });

    document.addEventListener("change", event => {
      const target = event.target;

      if (target.id === "playerCount") {
        config.playerCount = Math.min(15, Math.max(5, Number(target.value) || 8));
        saveData("mafiaConfig", config);

        const preview = $("#rolePreview");
        const countLabel = $("#lobbyCount");

        if (preview) preview.innerHTML = renderRoleTiles(config.playerCount);
        if (countLabel) countLabel.textContent = `${config.playerCount} игроков`;
      }

      if (target.matches("[data-setting]")) {
        settings[target.dataset.setting] = target.checked;
        saveData("mafiaSettings", settings);
        toast("Настройка сохранена.");
      }
    });

    document.addEventListener("submit", event => {
      if (event.target.id === "chatForm") {
        sendChatMessage(event);
        return;
      }

      if (event.target.id === "profileForm") {
        event.preventDefault();

        const input = $("#settingName");
        config.name = input.value.trim().slice(0, 20) || "Вы";
        saveData("mafiaConfig", config);

        if (game) {
          const me = userPlayer();
          if (me) me.name = config.name;
        }

        toast("Имя сохранено.");
        render();
      }
    });

    render();
    setInterval(tickPhase, 250);
  </script>
</body>
</html>
