
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мафия — локальная игра</title>

  <style>
    :root {
      --bg: #020d20;
      --panel: #062653;
      --text: #e8f5ff;
      --muted: #9abbd8;
      --blue: #078cf7;
      --green: #00d8ad;
      --red: #f3275b;
      --purple: #9b4dff;
      --yellow: #ffc92d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      color: var(--text);
      font: 15px/1.45 Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, #0a315d 0%, transparent 35%),
        linear-gradient(180deg, #020a18 0%, #001127 100%);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app-shell {
      width: min(1360px, 100%);
      min-height: calc(100vh - 32px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(8, 123, 213, 0.7);
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 0%, rgba(0, 116, 255, 0.08), transparent 35%),
        linear-gradient(180deg, #03142c, #031a37);
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.4);
    }

    .topbar {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(11, 103, 180, 0.55);
      background: rgba(2, 16, 36, 0.8);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(29, 162, 255, 0.45);
      border-radius: 13px;
      background: linear-gradient(135deg, #07549a, #04254d);
      font-size: 25px;
    }

    .brand-name strong,
    .brand-name small {
      display: block;
    }

    .brand-name strong {
      font-size: 19px;
    }

    .brand-name small {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .local-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #b6d4ec;
      font-size: 12px;
    }

    .local-status i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 9px rgba(0, 216, 173, 0.7);
    }

    .icon-button {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border: 1px solid #0b4b83;
      border-radius: 10px;
      color: #a8dcff;
      background: #06264c;
      cursor: pointer;
      font-size: 19px;
    }

    .icon-button:hover {
      background: #093768;
    }

    .workspace {
      min-height: calc(100vh - 100px);
      display: grid;
      grid-template-columns: 195px minmax(0, 1fr);
      gap: 18px;
      padding: 16px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-top: 3px;
    }

    .side-label {
      margin: 9px 9px 5px;
      color: #72a5ca;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .nav-link {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #a9cce7;
      text-align: left;
      background: transparent;
      cursor: pointer;
      font-size: 14px;
    }

    .nav-link b {
      width: 21px;
      color: #8bc4ed;
      text-align: center;
      font-size: 18px;
      font-weight: normal;
    }

    .nav-link:hover {
      background: rgba(9, 58, 105, 0.5);
    }

    .nav-link.active {
      border-color: rgba(9, 130, 229, 0.4);
      color: #fff;
      background: linear-gradient(135deg, rgba(0, 140, 255, 0.3), rgba(3, 62, 119, 0.55));
      box-shadow: inset 3px 0 #078cf7;
    }

    .nav-link.active b {
      color: #2bbaff;
    }

    .sidebar-note {
      margin-top: 16px;
      padding: 11px;
      border: 1px solid rgba(15, 90, 145, 0.45);
      border-radius: 9px;
      color: #a1c3de;
      background: rgba(3, 28, 58, 0.8);
      font-size: 12px;
      line-height: 1.5;
    }

    .main-area {
      min-width: 0;
      padding-bottom: 10px;
    }

    .page-head {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .eyebrow {
      margin-bottom: 3px;
      color: #72b2df;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .page-head h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.15;
    }

    .phase-pill {
      padding: 7px 10px;
      border: 1px solid rgba(15, 133, 226, 0.42);
      border-radius: 8px;
      color: #c5e8ff;
      background: rgba(5, 43, 83, 0.8);
      font-size: 12px;
      white-space: nowrap;
    }

    .mobile-nav {
      display: none;
    }

    .card {
      min-width: 0;
      padding: 14px;
      border: 1px solid rgba(11, 108, 188, 0.42);
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(4, 40, 82, 0.96), rgba(4, 28, 60, 0.96));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .card h2,
    .card h3 {
      margin: 0;
    }

    .card h2 {
      font-size: 17px;
    }

    .card h3 {
      font-size: 15px;
    }

    .card + .card {
      margin-top: 12px;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 12px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(300px, 0.92fr);
      gap: 12px;
    }

    .welcome-card {
      position: relative;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
      padding: 22px;
      background:
        radial-gradient(circle at 85% 20%, rgba(0, 161, 255, 0.2), transparent 31%),
        linear-gradient(135deg, #06346a, #031b3a 78%);
    }

    .welcome-card::after {
      content: "♠";
      position: absolute;
      top: -38px;
      right: 10px;
      color: rgba(72, 160, 232, 0.09);
      font-size: 205px;
      pointer-events: none;
    }

    .welcome-card > * {
      position: relative;
      z-index: 1;
    }

    .welcome-card h2 {
      max-width: 520px;
      margin: 7px 0 9px;
      font-size: clamp(24px, 3vw, 34px);
      line-height: 1.15;
    }

    .welcome-card p {
      max-width: 510px;
      margin: 0 0 15px;
      color: #bad7ed;
      font-size: 14px;
      line-height: 1.5;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 14px;
      border: 0;
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, #008cff, #0574eb);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 5px 14px rgba(0, 121, 255, 0.18);
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    .btn:hover:not(:disabled) {
      filter: brightness(1.12);
    }

    .btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn.secondary {
      border: 1px solid #075897;
      color: #c1e1fa;
      background: linear-gradient(135deg, #06224a, #063568);
      box-shadow: none;
    }

    .btn.danger {
      background: linear-gradient(135deg, #e42d58, #f01451);
    }

    .btn.full {
      width: 100%;
    }

    /* ---------- Иллюстрации ролей ---------- */

    .role-art {
      display: block;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .role-tile {
      min-height: 128px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 9px 5px;
      border: 1px solid transparent;
      border-radius: 9px;
      text-align: center;
    }

    .role-tile .role-art {
      width: 58px;
      height: 58px;
      flex: none;
    }

    .role-tile .role-name {
      font-size: 11px;
      line-height: 1.25;
    }

    .role-tile strong {
      font-size: 18px;
    }

    .tone-green {
      border-color: rgba(0, 189, 158, 0.3);
      color: #79f2d6;
      background: linear-gradient(135deg, #00565c, #063a48);
    }

    .tone-red {
      border-color: rgba(255, 50, 99, 0.34);
      color: #ff7896;
      background: linear-gradient(135deg, #601232, #27152c);
    }

    .tone-blue {
      border-color: rgba(0, 123, 247, 0.34);
      color: #83ccff;
      background: linear-gradient(135deg, #063e80, #03244e);
    }

    .tone-purple {
      border-color: rgba(161, 91, 255, 0.34);
      color: #d4aaff;
      background: linear-gradient(135deg, #42176b, #211747);
    }

    .role-note {
      margin: 10px 0 0;
      color: #a1c3de;
      font-size: 12px;
      line-height: 1.45;
    }

    .phase-banner {
      position: relative;
      min-height: 103px;
      display: flex;
      align-items: center;
      gap: 14px;
      overflow: hidden;
      padding: 13px 15px 20px;
      border: 1px solid rgba(11, 108, 188, 0.5);
      border-radius: 11px;
      background:
        radial-gradient(circle at 10% 50%, rgba(0, 145, 255, 0.18), transparent 28%),
        linear-gradient(135deg, #062b59, #041b39);
    }

    .phase-banner.day {
      background:
        radial-gradient(circle at 10% 50%, rgba(255, 195, 35, 0.15), transparent 28%),
        linear-gradient(135deg, #3b3216, #041b39);
    }

    .phase-icon {
      width: 54px;
      flex: 0 0 54px;
      color: #6ac9ff;
      text-align: center;
      font-size: 43px;
      text-shadow: 0 0 15px rgba(0, 142, 255, 0.6);
    }

    .phase-banner.day .phase-icon {
      color: #ffd031;
      text-shadow: 0 0 15px rgba(255, 200, 0, 0.45);
    }

    .phase-info {
      min-width: 0;
      flex: 1;
    }

    .phase-info small {
      color: #b1d4ef;
      font-size: 12px;
    }

    .phase-info h2 {
      margin: 2px 0;
      color: #55bdff;
      font-size: 24px;
    }

    .phase-banner.day .phase-info h2 {
      color: #ffd23a;
    }

    .phase-info p {
      margin: 0;
      color: #bad7ed;
      font-size: 12px;
    }

    .phase-timer {
      min-width: 66px;
      text-align: right;
    }

    .phase-timer strong,
    .phase-timer small {
      display: block;
    }

    .phase-timer strong {
      color: #fff;
      font-size: 21px;
      font-variant-numeric: tabular-nums;
    }

    .phase-timer small {
      color: #a9cce8;
      font-size: 11px;
    }

    .progress {
      height: 7px;
      position: absolute;
      right: 15px;
      bottom: 9px;
      left: 15px;
      overflow: hidden;
      border-radius: 99px;
      background: #092f5c;
    }

    .progress span {
      height: 100%;
      display: block;
      border-radius: inherit;
      background: linear-gradient(90deg, #04b7ff, #087bf9);
      box-shadow: 0 0 9px rgba(0, 163, 255, 0.6);
      transition: width 0.2s linear;
    }

    .phase-banner.day .progress span {
      background: linear-gradient(90deg, #ffe329, #ffbe1f);
    }

    .private-role {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px 15px;
      border: 1px solid rgba(255, 41, 91, 0.38);
      border-radius: 10px;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 0, 75, 0.18), transparent 45%),
        linear-gradient(135deg, #260e2f, #1b1635);
    }

    .private-role.tone-green {
      border-color: rgba(0, 189, 158, 0.35);
      background: linear-gradient(135deg, #004e54, #013946);
    }

    .private-role.tone-blue {
      border-color: rgba(0, 123, 247, 0.35);
      background: linear-gradient(135deg, #043d80, #03244e);
    }

    .private-role.tone-purple {
      border-color: rgba(161, 91, 255, 0.35);
      background: linear-gradient(135deg, #42176b, #211747);
    }

    .private-role .role-art {
      width: 72px;
      height: 72px;
      flex: 0 0 72px;
    }

    .private-role-content {
      min-width: 0;
      flex: 1;
    }

    .private-role .eyebrow {
      margin-bottom: 3px;
      font-size: 10px;
    }

    .private-role h2 {
      margin: 0 0 3px;
      font-size: 18px;
    }

    .private-role p {
      margin: 0;
      color: #d0e6f5;
      font-size: 13px;
      line-height: 1.4;
    }

    .private-chip {
      padding: 6px 8px;
      border: 1px solid rgba(207, 232, 255, 0.2);
      border-radius: 7px;
      color: #d1eaff;
      background: rgba(2, 18, 38, 0.4);
      font-size: 11px;
      white-space: nowrap;
    }

    .wide-card {
      grid-column: 1 / -1;
    }

    .two-column {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 0.82fr);
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 13px;
      color: #c2def4;
      font-size: 14px;
    }

    .field input,
    .field select,
    .chat-composer input {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid #0a4e8c;
      border-radius: 8px;
      outline: none;
      color: #e8f5ff;
      background: #031c3d;
      font-size: 14px;
    }

    .field input:focus,
    .field select:focus,
    .chat-composer input:focus {
      border-color: #138dea;
      box-shadow: 0 0 0 3px rgba(0, 140, 247, 0.12);
    }

    .field select option {
      color: #e8f5ff;
      background: #031c3d;
    }

    .notice {
      margin: 10px 0;
      padding: 10px 11px;
      border: 1px solid rgba(20, 118, 190, 0.45);
      border-radius: 8px;
      color: #c1def4;
      background: rgba(4, 44, 84, 0.7);
      font-size: 13px;
      line-height: 1.45;
    }

    .notice.success {
      border-color: rgba(0, 202, 163, 0.38);
      color: #c4f6e9;
      background: rgba(0, 105, 87, 0.24);
    }

    .notice.warning {
      border-color: rgba(255, 201, 45, 0.4);
      color: #ffe8a0;
      background: rgba(119, 83, 0, 0.18);
    }

    .game-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
      gap: 12px;
      align-items: start;
    }

    .game-phase-wide,
    .game-role-wide {
      grid-column: 1 / -1;
    }

    .game-aside {
      grid-column: 2;
      grid-row: 3;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .game-main {
      grid-column: 1;
      grid-row: 3;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .action-card p {
      margin: 7px 0;
      color: #bfd9ed;
      font-size: 14px;
      line-height: 1.45;
    }

    .target-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }

    .target-card {
      min-width: 0;
      min-height: 59px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px;
      border: 1px solid rgba(28, 103, 163, 0.58);
      border-radius: 8px;
      color: #e2f3ff;
      text-align: left;
      background: rgba(3, 30, 63, 0.85);
      cursor: pointer;
    }

    .target-card:hover {
      border-color: #1889d7;
      background: rgba(5, 50, 92, 0.9);
    }

    .target-card.selected {
      border-color: #00caa9;
      background: linear-gradient(135deg, rgba(0, 110, 99, 0.65), rgba(3, 40, 69, 0.9));
      box-shadow: 0 0 0 1px rgba(0, 202, 169, 0.18);
    }

    .target-card strong,
    .target-card small {
      display: block;
    }

    .target-card strong {
      overflow: hidden;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .target-card small {
      margin-top: 2px;
      color: #a7c8e3;
      font-size: 11px;
    }

    .target-check {
      width: 16px;
      height: 16px;
      flex: 0 0 16px;
      margin-left: auto;
      border: 1px solid #70a9d4;
      border-radius: 50%;
    }

    .target-card.selected .target-check {
      border-color: var(--green);
      background: var(--green);
      box-shadow: inset 0 0 0 3px #063c46;
    }

    .avatar {
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 50%;
      color: #e8f8ff;
      background: linear-gradient(135deg, #1399c7, #0054a5);
      font-size: 16px;
    }

    .avatar.user-avatar {
      background: linear-gradient(135deg, #00b99d, #00695e);
    }

    .avatar.dead {
      opacity: 0.5;
      filter: grayscale(0.7);
    }

    .private-strip {
      margin: 10px 0;
      padding: 9px 10px;
      border: 1px solid rgba(255, 53, 103, 0.3);
      border-radius: 8px;
      color: #ffc5d3;
      background: rgba(110, 17, 53, 0.28);
      font-size: 13px;
      line-height: 1.45;
    }

    .selection-state {
      margin-top: 8px;
      padding: 9px 10px;
      border-radius: 8px;
      color: #b9d9f1;
      background: rgba(3, 24, 49, 0.7);
      font-size: 13px;
    }

    .auto-note {
      padding: 10px;
      border: 1px solid rgba(22, 132, 203, 0.32);
      border-radius: 8px;
      color: #bfdef4;
      background: rgba(2, 32, 65, 0.58);
      font-size: 13px;
      line-height: 1.45;
    }

    .player-row,
    .stat-row,
    .settings-row,
    .history-row {
      min-height: 42px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 5px 4px;
      border-bottom: 1px solid rgba(30, 106, 177, 0.3);
      font-size: 13px;
    }

    .player-row:last-child,
    .stat-row:last-child,
    .settings-row:last-child,
    .history-row:last-child {
      border-bottom: 0;
    }

    .player-row-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-status {
      margin-left: auto;
      color: #00dcbd;
      font-size: 12px;
      white-space: nowrap;
    }

    .player-status.dead {
      color: #91a5bb;
    }

    .role-label {
      padding: 4px 7px;
      border-radius: 5px;
      font-size: 11px;
      white-space: nowrap;
    }

    .role-label.hidden-role {
      color: #b0cce2;
      background: #0a315d;
    }

    .role-label.tone-green {
      color: #a1ffeb;
      background: rgba(0, 120, 104, 0.42);
    }

    .role-label.tone-red {
      color: #ffb1c2;
      background: rgba(145, 20, 62, 0.45);
    }

    .role-label.tone-blue {
      color: #b0e0ff;
      background: rgba(9, 76, 157, 0.5);
    }

    .role-label.tone-purple {
      color: #e0c5ff;
      background: rgba(97, 42, 159, 0.45);
    }

    .empty-state {
      padding: 14px 8px;
      color: #a3c3dd;
      text-align: center;
      font-size: 13px;
      line-height: 1.5;
    }

    .role-choice {
      min-height: 76px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      padding: 9px;
      border: 1px solid rgba(63, 144, 202, 0.24);
      border-radius: 10px;
    }

    .role-choice .role-art {
      width: 60px;
      height: 60px;
      flex: 0 0 60px;
    }

    .role-choice strong {
      display: block;

    }

      background: #8a6911;

      background: #922343;

    .stat-row span:last-child {

    }

    .history-row {

    .history-info {

    }

    .history-info strong,
    .history-info small {
      display: block;
    }

    .history-info strong {
      font-size: 13px;
    }

    .history-info small {
      margin-top: 3px;
      color: #a9cbe5;
      font-size: 11px;
    }

    .chevron {
      color: #75c6fa;
      font-size: 19px;
    }

    .settings-row {
      min-height: 48px;
      font-size: 14px;
    }

    .setting-icon {
      width: 26px;
      color: #a8dcff;
      text-align: center;
      font-size: 19px;
    }

    .switch {
      position: relative;
      width: 40px;
      height: 22px;
      display: inline-block;
      margin-left: auto;
    }

    .switch input {
      width: 0;
      height: 0;
      opacity: 0;
    }

    .switch span {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: #315779;
      cursor: pointer;
      transition: 0.2s;
    }

    .switch span::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #d7ecff;
      transition: 0.2s;
    }

    .switch input:checked + span {
      background: #008fff;
    }

    .switch input:checked + span::before {
      transform: translateX(18px);
    }

    .toast {
      position: fixed;
      z-index: 20;
      right: 18px;
      bottom: 18px;
      max-width: min(370px, calc(100vw - 36px));
      padding: 12px 15px;
      border: 1px solid rgba(48, 154, 230, 0.6);
      border-radius: 9px;
      color: #e8f5ff;
      background: #062b55;
      box-shadow: 0 9px 28px rgba(0, 0, 0, 0.35);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: 0.2s;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid #21a9ff;
      outline-offset: 2px;
    }

    @media (max-width: 900px) {
      .workspace {
        grid-template-columns: 165px minmax(0, 1fr);
        gap: 13px;

      .two-column {
        grid-template-columns: minmax(0, 1fr);
      }

      .wide-card {
        grid-column: auto;
      }

      .game-layout {
        grid-template-columns: minmax(0, 1fr) minmax(270px, 0.82fr);

    @media (max-width: 680px) {
      body {
        padding: 0;
      }

      .app-shell {
        min-height: 100vh;
        border: 0;
        border-radius: 0;
      }

      .topbar {
        min-height: 60px;
        padding: 8px 12px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        font-size: 23px;
      }

      .brand-name strong {
        font-size: 17px;
      }

      .brand-name small {
        font-size: 11px;
      }

      .local-status {
        display: none;
      }

      .workspace {
        min-height: 0;
        display: block;
        padding: 12px 11px 82px;
      }

      .sidebar {
        display: none;
      }

      .page-head {
        min-height: 48px;
        margin-bottom: 10px;
      }

      .page-head h1 {
        font-size: 23px;
      }

      .phase-pill {
        max-width: 48%;
        padding: 6px 7px;
        overflow: hidden;
        font-size: 11px;
        text-overflow: ellipsis;
      }

      .mobile-nav {
        position: fixed;
        z-index: 10;
        right: 0;
        bottom: 0;
        left: 0;
        min-height: 62px;
        display: flex;
        justify-content: space-around;
        padding: 6px 5px calc(6px + env(safe-area-inset-bottom));
        border-top: 1px solid rgba(11, 103, 180, 0.65);
        background: linear-gradient(180deg, rgba(2, 20, 43, 0.98), #03172f);
      }

      .mobile-link {
        min-width: 48px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        border: 0;
        border-radius: 7px;
        color: #9bcbed;
        background: transparent;
        cursor: pointer;
        font-size: 10px;
      }

      .mobile-link b {
        font-size: 18px;
        font-weight: normal;
        line-height: 1;
      }

      .mobile-link.active {
        color: #03baff;
      }

      .welcome-card {
        padding: 18px;
      }

      .welcome-card h2 {
        font-size: 27px;
      }

      .game-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .game-phase-wide,
      .game-role-wide,
      .game-aside,

        grid-column: 1;
        grid-row: auto;
      }

      .game-layout .game-aside {
        order: 3;

      .game-layout .game-main {
        order: 4;
      }

      .game-layout .game-phase-wide {
        order: 1;

      .game-layout .game-role-wide {

      .private-role {

      .private-role .role-art {
        width: 56px;

      }

      .private-role h2 {
        font-size: 16px;
      }

      .private-role p {
        font-size: 12px;
      }

      .private-chip {
        font-size: 10px;
      }

      .toast {
        right: 10px;
        bottom: 72px;
        left: 10px;
        max-width: none;
      }
    }

    @media (max-width: 430px) {
      .card {
        padding: 12px;
      }

      .role-grid {
        gap: 5px;
      }

      .role-tile {
        min-height: 110px;
        padding: 7px 3px;
      }

      .role-tile .role-art {
        width: 46px;
        height: 46px;
      }

      .role-tile .role-name {
        font-size: 10px;
      }

      .phase-banner {
        gap: 8px;
        padding: 11px 11px 19px;
      }

      .phase-icon {
        width: 43px;
        flex-basis: 43px;
        font-size: 36px;
      }

      .phase-info h2 {
        font-size: 21px;
      }

      .phase-info p {
        font-size: 11px;
      }

      .phase-timer {
        min-width: 55px;
      }

      .phase-timer strong {
        font-size: 18px;
      }

      .role-reveal-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">🕵</div>
        <div class="brand-name">
          <strong>Мафия</strong>
          <small>Локальная игра с ботами</small>
        </div>
      </div>

      <div class="topbar-right">
        <div class="local-status"><i></i>Автономный режим</div>
        <button class="icon-button" type="button" data-page="settings" aria-label="Настройки">⚙</button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="side-label">ИГРА</div>
        <button class="nav-link active" type="button" data-page="home"><b>⌂</b>Главная</button>
        <button class="nav-link" type="button" data-page="lobby"><b>♣</b>Новая партия</button>
        <button class="nav-link" type="button" data-page="game"><b>☾</b>Игровой процесс</button>
        <button class="nav-link" type="button" data-page="roles"><b>♟</b>Роли</button>

        <div class="side-label">ОБЩЕНИЕ</div>
        <button class="nav-link" type="button" data-page="chat"><b>▣</b>Чат</button>
        <button class="nav-link" type="button" data-page="players"><b>♟</b>Участники</button>
        <button class="nav-link" type="button" data-page="stats"><b>▥</b>Статистика</button>
        <button class="nav-link" type="button" data-page="settings"><b>☰</b>Настройки</button>

        <div class="sidebar-note">
          Партия проходит в этом браузере. Остальные участники — боты.
          Переключение фаз и подсчёт голосов выполняются автоматически.
        </div>
      </aside>

      <main class="main-area">
        <div class="page-head">
          <div>
            <div class="eyebrow" id="pageEyebrow">Игровое приложение</div>
            <h1 id="pageTitle">Главная</h1>
          </div>
          <div class="phase-pill" id="phaseBadge">Партия не начата</div>
        </div>

        <div id="appView"></div>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="Главная навигация">
      <button class="mobile-link active" type="button" data-page="home"><b>⌂</b>Главная</button>
      <button class="mobile-link" type="button" data-page="game"><b>☾</b>Игра</button>
      <button class="mobile-link" type="button" data-page="chat"><b>▣</b>Чат</button>
      <button class="mobile-link" type="button" data-page="players"><b>♟</b>Игроки</button>
      <button class="mobile-link" type="button" data-page="stats"><b>▥</b>Статистика</button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];

    // Длительность фаз в секундах
    const PHASE_SECONDS = {
      night: 60,
      day: 120,
      vote: 30,
      results: 6
    };

    const ROLE_INFO = {
      citizen: {
        name: "Мирный житель",
        tone: "tone-green",
        description: "Обсуждайте события и помогите городу найти мафию."
      },
      mafia: {
        name: "Мафия",
        tone: "tone-red",
        description: "Ночью выбирайте цель. Днём не выдавайте свою роль."
      },
      sheriff: {
        name: "Комиссар",
        tone: "tone-blue",
        description: "Каждую ночь проверяйте одного игрока: мафия он или нет."
      },
      doctor: {
        name: "Доктор",
        tone: "tone-purple",
        description: "Каждую ночь выбирайте игрока, которого хотите спасти."
      }
    };

    // Иллюстрации ролей (SVG). Каждая функция получает уникальный префикс id,
    // чтобы градиенты и фильтры не конфликтовали при повторном использовании.
        const ROLE_ART = {
citizen: id => `
  <defs>
    <radialGradient id="${id}-bg" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#3ff0c8"/>
      <stop offset="1" stop-color="#035c52"/>
    </radialGradient>
    <linearGradient id="${id}-coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fffb"/>
      <stop offset="1" stop-color="#7fe6cc"/>
    </linearGradient>
    <clipPath id="${id}-clip">
      <circle cx="60" cy="60" r="56"/>
    </clipPath>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#${id}-bg)"/>
  <circle cx="60" cy="60" r="51" fill="none"
          stroke="rgba(255,255,255,.28)" stroke-width="2" stroke-dasharray="4 5"/>

  <g clip-path="url(#${id}-clip)">
    <g transform="translate(0 -8)">
      <path d="M28 110 C30 89 44 81 60 81 C76 81 90 89 92 110 Z" fill="url(#${id}-coat)"/>
      <path d="M53 81 L60 93 L67 81 Z" fill="#0b6b5f"/>
      <rect x="55" y="68" width="10" height="13" rx="2" fill="#ffd9b8"/>
      <circle cx="60" cy="56" r="13.5" fill="#ffe2c4"/>
      <path d="M46 53 Q47 38 60 38 Q73 38 74 53 Q68 46 60 46 Q52 46 46 53 Z" fill="#0b3b38"/>
      <circle cx="55" cy="57" r="1.9" fill="#0b3b38"/>
      <circle cx="65" cy="57" r="1.9" fill="#0b3b38"/>
      <path d="M55 63 Q60 66.5 65 63" fill="none" stroke="#b5564a" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="77" cy="95" r="5" fill="#ffd23a" stroke="#fff3c4" stroke-width="1.4"/>
    </g>
  </g>
`,

mafia: id => `
  <defs>
    <radialGradient id="${id}-bg" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ff3d72"/>
      <stop offset="1" stop-color="#4a0a1f"/>
    </radialGradient>
    <linearGradient id="${id}-suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a16"/>

    let artCounter = 0;

    function roleArt(role, className = "role-art") {
      const info = ROLE_INFO[role];

      const id = `ra${artCounter}`;

      return `
        <svg class="${className}" viewBox="0 0 120 120" role="img" aria-label="${escapeHTML(info.name)}">
          ${ROLE_ART[role](id)}
        </svg>
      `;
    }

    const PAGE_TITLES = {
      home: "Главная",
      lobby: "Новая партия",
      game: "Игровой процесс",
      roles: "Роли",
      chat: "Чат",
      players: "Участники",
      stats: "Статистика",
      settings: "Настройки"
    };

    const PHASE_INFO = {
      night: {
        name: "Ночь",
        icon: "☾",
        description: "Ваше ночное действие выполнится автоматически по таймеру."
      },
      day: {
        name: "День",
        icon: "☀",
        description: "Обсуждение. Голосование начнётся автоматически."
      },
      vote: {
        name: "Голосование",
        icon: "⚖",
        description: "Выбранный голос будет учтён по окончании таймера."
      },
      results: {
        name: "Итоги голосования",
        icon: "▤",
        description: "Следующий раунд начнётся автоматически."
      }
    };

    function formatDuration(seconds) {
      if (seconds >= 60 && seconds % 60 === 0) return `${seconds / 60} мин`;
      return `${seconds} сек`;
    }

    function loadData(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveData(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {
        // Игра продолжит работать, даже если хранилище недоступно.
      }
    }

    const config = Object.assign(
      { name: "Вы", playerCount: 8 },
      loadData("mafiaConfig", {})
    );

    config.playerCount = Math.min(15, Math.max(5, Number(config.playerCount) || 8));

    const settings = Object.assign(
      { sound: false, vibration: false },
      loadData("mafiaSettings", {})
    );

    const stats = Object.assign(
      { played: 0, wins: 0, rolePlayed: {}, roleWins: {} },
      loadData("mafiaStats", {})
    );

    stats.rolePlayed = stats.rolePlayed || {};
    stats.roleWins = stats.roleWins || {};

    let history = loadData("mafiaHistory", []);
    if (!Array.isArray(history)) history = [];

    let page = "home";
    let game = null;
    let toastTimer = null;

    function escapeHTML(value) {
      const replacements = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      };

      return String(value ?? "").replace(/[&<>"']/g, character => replacements[character]);
    }

    function timeNow() {
      return new Date().toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatDate(value) {
      return new Date(value).toLocaleString("ru-RU", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatClock(seconds) {
      const safeSeconds = Math.max(0, Math.ceil(seconds));
      const minutes = Math.floor(safeSeconds / 60);
      const rest = safeSeconds % 60;

      return `${String(minutes).padStart(2, "0")}:${String(rest).padStart(2, "0")}`;
    }

    function toast(message) {
      const element = $("#toast");
      element.textContent = message;
      element.classList.add("show");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => element.classList.remove("show"), 2600);
    }

    function feedback() {
      if (settings.vibration && navigator.vibrate) {
        navigator.vibrate(18);
      }

      if (!settings.sound) return;

      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        const context = new AudioContextClass();
        const oscillator = context.createOscillator();
        const gain = context.createGain();

        oscillator.frequency.value = 620;
        gain.gain.value = 0.035;
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + 0.07);
        oscillator.onended = () => context.close();
      } catch {
        // Звук необязателен.
      }
    }

    function roleCounts(total) {
      let mafia = 1;

      if (total >= 7 && total <= 9) mafia = 2;
      if (total >= 10 && total <= 12) mafia = 3;
      if (total >= 13) mafia = 4;

      return {
        citizen: total - mafia - 2,
        mafia,
        sheriff: 1,
        doctor: 1
      };
    }

    function renderRoleTiles(total) {
      const counts = roleCounts(total);

      return `
        <div class="role-grid">
          ${Object.entries(counts).map(([role, count]) => {
            const info = ROLE_INFO[role];

            return `
              <div class="role-tile ${info.tone}">
                ${roleArt(role)}
                <span class="role-name">${escapeHTML(info.name)}</span>
                <strong>${count}</strong>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function getAlivePlayers() {
      return game ? game.players.filter(player => player.alive) : [];
    }

    function userPlayer() {
      return game ? game.players.find(player => player.isUser) : null;
    }

    function randomItem(items) {
      if (!items || items.length === 0) return null;
      return items[Math.floor(Math.random() * items.length)];
    }

    function shuffle(items) {
      const result = [...items];

      for (let index = result.length - 1; index > 0; index--) {
        const other = Math.floor(Math.random() * (index + 1));
        [result[index], result[other]] = [result[other], result[index]];
      }

      return result;
    }

    function addMessage(channel, senderId, author, text, system = false) {
      if (!game) return;

      game.messages.push({
        channel,
        senderId,
        author,
        text,
        time: timeNow(),
        system
      });

      if (game.messages.length > 180) {
        game.messages.splice(0, game.messages.length - 180);
      }
    }

    function addSystem(text, type = "info") {
      if (!game) return;

      game.log.push({
        text,
        time: timeNow(),
        type
      });

      if (game.log.length > 60) game.log.shift();

      addMessage("public", null, "Система", text, true);
    }

    function phaseSecondsLeft() {
      if (!game || !game.phaseEndsAt) return 0;
      return Math.max(0, (game.phaseEndsAt - Date.now()) / 1000);
    }

    function phaseProgress() {
      if (!game || !game.phaseStartedAt || !PHASE_SECONDS[game.phase]) return 0;

      const duration = PHASE_SECONDS[game.phase] * 1000;
      const elapsed = Date.now() - game.phaseStartedAt;

      return Math.min(100, Math.max(0, (elapsed / duration) * 100));
    }

    function renderPhaseBanner() {
      if (!game || game.status !== "playing") return "";

      const phase = PHASE_INFO[game.phase];
      if (!phase) return "";

      const alive = getAlivePlayers().length;
      const progress = phaseProgress();

      return `
        <div class="phase-banner ${game.phase === "day" || game.phase === "vote" ? "day" : ""}">
          <div class="phase-icon">${phase.icon}</div>
          <div class="phase-info">
            <small>РАУНД ${game.round} · ${alive} из ${game.players.length} в игре</small>
            <h2>${phase.name}</h2>
            <p>${phase.description}</p>
          </div>
          <div class="phase-timer">
            <strong data-phase-clock>${formatClock(phaseSecondsLeft())}</strong>
            <small>осталось</small>
          </div>
          <div class="progress">
            <span data-phase-progress style="width:${progress}%"></span>
          </div>
        </div>
      `;
    }

    function renderRolePanel() {
      const player = userPlayer();
      if (!player) return "";

      const info = ROLE_INFO[player.role];

      return `
        <section class="private-role ${info.tone}">
          ${roleArt(player.role)}
          <div class="private-role-content">
            <div class="eyebrow">ВАША РОЛЬ · ТОЛЬКО ВАМ</div>
            <h2>${escapeHTML(info.name)}${player.alive ? "" : " · вы выбыли"}</h2>
            <p>${escapeHTML(info.description)}</p>
          </div>
          <span class="private-chip">🔒 Ваша роль</span>
        </section>
      `;
    }

    function renderRecentHistory(limit = 4) {
      if (history.length === 0) {
        return `<div class="empty-state">Здесь появятся результаты завершённых партий.</div>`;
      }

      return history.slice(0, limit).map((item, index) => `
        <div class="history-row">
          <div class="history-icon">${item.won ? "🏆" : "☠"}</div>
          <div class="history-info">
            <strong>Партия #${history.length - index}</strong>
            <small>
              ${escapeHTML(item.result || "")}

              · ${escapeHTML(formatDate(item.date))}
            </small>
          </div>
          <span class="chevron">${item.won ? "✓" : "›"}</span>
        </div>
      `).join("");
    }

    function renderHome() {
      if (!game) {
        return `
          <div class="dashboard-grid">

              <div class="eyebrow">Готовы начать?</div>
              <h2>В городе наступает ночь</h2>
              <p>

            <section class="card">

                <h2>Состав ролей</h2>
                <span class="small muted">${config.playerCount} игроков</span>

              ${renderRoleTiles(config.playerCount)}

            <section class="card wide-card">

              </div>
              ${renderRecentHistory(3)}
            </section>
          </div>
        `;
      }

      const alive = getAlivePlayers().length;

      if (game.status === "finished") {
        const winnerText = game.winner === "mafia" ? "Победила мафия" : "Победили мирные жители";

        return `

              </div>
              ${renderRecentHistory(4)}

          </div>
        `;

            <div class="card-head">
              <h2>Идёт партия</h2>
              <span class="small muted">${alive} игроков в живых</span>

            <div style="height:10px"></div>

            </div>
          </section>

          <section class="card">
            <div class="card-head">
              <h2>Ваша роль</h2>
              <span class="small muted">видна только вам</span>
            </div>
            ${renderRolePanel()}
          </section>

            <div class="card-head">

              <button class="btn secondary" type="button" data-page="players">Все игроки</button>
            </div>
            <div class="stat-grid">
              <div class="stat-box"><strong>${game.players.length}</strong><small>всего</small></div>
              <div class="stat-box"><strong>${alive}</strong><small>в игре</small></div>
              <div class="stat-box"><strong>${game.players.length - alive}</strong><small>выбыли</small></div>

    function renderTargetSelection(candidates, selectedId, action, hint) {

      return `

              data-action="${action}"

            >
